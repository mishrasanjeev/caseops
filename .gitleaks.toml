# CaseOps gitleaks configuration.
#
# Extends the upstream default config (AWS / GitHub PAT / Stripe /
# Anthropic / OpenAI / SendGrid / generic-api-key) with allowlist
# entries for files that legitimately contain `key=` assignments
# whose values are eval-test scenario identifiers, NOT secrets.
#
# Anchor incidents:
#  - 2026-05-01: scheduled gitleaks run flagged 8 false positives on
#    `apps/api/src/caseops_api/scripts/eval_*.py` where
#    `key="quashing-482"`, `key="498a-cruelty"`, etc. are CitationCase
#    / EvalCase dataclass fields naming legal eval scenarios. Entropy
#    on dotted slug strings happens to clear the generic-api-key
#    threshold, but these are never written to a response, never sent
#    to a third party, and never persisted as auth material.
#  - 2026-05-09: scheduled `--all` history scan flagged two historical
#    findings that no longer apply to the live codebase:
#      (1) `pg-validation-secret-at-least-32-bytes` in
#          `.github/workflows/ci.yml` (commit 34ded21, 2026-04-25) —
#          a CI-only test placeholder, never a production secret.
#      (2) Pine Labs MCP `X-Client-Secret` literal in `.mcp.json`
#          (commit 9bb22e1, 2026-04-21) — a sandbox/test credential
#          that has been retired; `.mcp.json` is now gitignored. Both
#          findings are allowlisted by exact fingerprint so future
#          accidental reintroductions of these patterns will still
#          fail the scan.
#
# Reference: https://github.com/gitleaks/gitleaks#configuration

[extend]
useDefault = true

[allowlist]
description = "Skip known non-secret test identifiers that look like API keys"
paths = [
    '''apps/api/src/caseops_api/scripts/eval_citations\.py''',
    '''apps/api/src/caseops_api/scripts/eval_drafting\.py''',
    '''apps/api/src/caseops_api/scripts/eval_recommendations\.py''',
    '''apps/api/src/caseops_api/scripts/eval_hearing_packs\.py''',
    '''apps/api/tests/fixtures/.*''',
]
regexes = [
    '''LW-S10-NOTIFY''',
    '''CTR-LW9-UNGROUNDED''',
    # CI-test placeholder for the Postgres validation job's
    # CASEOPS_AUTH_SECRET env. Hard-coded literal in
    # `.github/workflows/ci.yml` and unchanged across history.
    '''pg-validation-secret-at-least-32-bytes''',
    # Retired Pine Labs MCP sandbox client secret, historical only —
    # the literal was committed to `.mcp.json` on 2026-04-21
    # (commit 9bb22e1) and remained in the file until this change
    # removed `.mcp.json` from tracking. The credential is no longer
    # in use; allowlisted by exact value so a real production secret
    # cannot coincidentally bypass the scan.
    '''024dd66a367549b380bd322ff6c3b279''',
]
