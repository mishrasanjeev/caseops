  "purpose_boundary": "Audit actions are immutable evidence of actor decisions. Domain events are idempotent projection inputs. Repository controls are CI/review evidence and are not tenant AuditEvent rows. A producer may write a company audit action and domain event atomically, but consumers must never treat one as the other.",
