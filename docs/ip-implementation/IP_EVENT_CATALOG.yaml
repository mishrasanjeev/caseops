    },
    {
      "name": "bulk_import.operation_state_changed",
      "version": 1,
      "owner": "bulk-import",
      "confidentiality": "confidential",
      "idempotency_key": "tenant_id:bulk_import_job_id:operation_version",
      "consumers": ["bulk-operation-status", "audit-evidence"],
      "retention": "data-operation retention; result evidence follows target retention",
      "payload_schema": {"required": ["tenant_id", "bulk_import_job_id", "from_state", "to_state", "operation_version", "safe_counts", "occurred_at", "correlation_id"]}
    }
  ]
}
