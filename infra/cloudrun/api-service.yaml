apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: caseops-api
  annotations:
    run.googleapis.com/minScale: "4"
spec:
  template:
    metadata:
      annotations:
        # Each API container deliberately accepts one request at a time: sync
        # database/LLM handlers must not share the Uvicorn event loop. Allow
        # enough instances to absorb normal browser fan-out while one request
        # is slow, rather than returning Cloud Run's capacity 429.
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/cloudsql-instances: "__PROJECT_ID__:__REGION__:__CLOUD_SQL_INSTANCE__"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
        # EG-007 (2026-04-23): every sensitive runtime value flows
        # through Secret Manager, never as a raw env value in the
        # manifest. Auth secret + DB URL + future SendGrid /
        # Anthropic / Pine Labs keys all use secretKeyRef.
        run.googleapis.com/secrets: "caseops-auth-secret:projects/__PROJECT_NUMBER__/secrets/caseops-auth-secret,caseops-machine-readiness-evidence-secret:projects/__PROJECT_NUMBER__/secrets/caseops-machine-readiness-evidence-secret,caseops-database-url:projects/__PROJECT_NUMBER__/secrets/caseops-database-url,caseops-openai-api-key:projects/__PROJECT_NUMBER__/secrets/caseops-openai-api-key,caseops-sendgrid-webhook-public-key:projects/__PROJECT_NUMBER__/secrets/caseops-sendgrid-webhook-public-key,caseops-ecourtsindia-api-token:projects/__PROJECT_NUMBER__/secrets/caseops-ecourtsindia-api-token"
    spec:
      # 2026-06-08 incident: one blocking request pinned the API event
      # loop and every subsequent request to the same instance timed out.
      # Keep per-instance concurrency at 1 until the sync DB handlers are
      # moved fully off the event loop.
      containerConcurrency: 1
      timeoutSeconds: 300
      serviceAccountName: "__SERVICE_ACCOUNT__"
      containers:
        - image: "__API_IMAGE__"
          command:
            - "uv"
            - "run"
            - "uvicorn"
            - "caseops_api.main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--app-dir"
            - "src"
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: CASEOPS_ENV
              value: "cloud"
            - name: CASEOPS_API_HOST
              value: "0.0.0.0"
            - name: CASEOPS_API_PORT
              value: "8080"
            - name: CASEOPS_API_DOCS_ENABLED
              value: "false"
            # EG-002 (2026-04-23): API service NEVER runs migrations
            # in cloud/prod. Migrations run as a separate Cloud Run
            # Job (caseops-migrate-job; see infra/cloudrun/migrate-job.yaml)
            # invoked as a deploy step BEFORE the new API revision is
            # cut into traffic. This avoids the multi-instance race
            # where each starting pod tries to upgrade simultaneously.
            - name: CASEOPS_AUTO_MIGRATE
              value: "false"
            - name: CASEOPS_PUBLIC_APP_URL
              value: "__PUBLIC_APP_URL__"
            # EG-007: DB URL via Secret Manager. The `caseops-database-url`
            # secret holds the full postgresql+psycopg://...
            # connection string (including password). Rotate via
            # `gcloud secrets versions add caseops-database-url --data-file=-`
            # then redeploy the API service with the new secret version.
            - name: CASEOPS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: "caseops-database-url"
                  key: "latest"
            - name: CASEOPS_DOCUMENT_STORAGE_BACKEND
              value: "gcs"
            - name: CASEOPS_DOCUMENT_STORAGE_GCS_BUCKET
              value: "__GCS_BUCKET__"
            - name: CASEOPS_DOCUMENT_STORAGE_GCS_PREFIX
              value: "documents"
            - name: CASEOPS_DOCUMENT_STORAGE_CACHE_PATH
              value: "/tmp/caseops-document-cache"
            - name: CASEOPS_GCP_PROJECT_ID
              value: "__PROJECT_ID__"
            - name: CASEOPS_TESSERACT_COMMAND
              value: "/usr/bin/tesseract"
            - name: CASEOPS_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: "caseops-auth-secret"
                  key: "__AUTH_SECRET_VERSION__"
            # Dedicated machine-to-machine key. Browser JWTs and platform-admin
            # sessions cannot use it to manufacture readiness evidence.
            - name: CASEOPS_MACHINE_READINESS_EVIDENCE_SECRET
              valueFrom:
                secretKeyRef:
                  name: "caseops-machine-readiness-evidence-secret"
                  key: "latest"
            # 2026-04-30: gpt-5.1 is the sole LLM provider. The prior
            # Anthropic→Haiku→OpenAI fallback ladder (commit 4104265)
            # was removed because the 3x token burn per click was
            # unjustified once Anthropic credits were retired. CASEOPS_
            # LLM_API_KEY now binds to caseops-openai-api-key; CASEOPS_
            # LLM_PROVIDER=openai. Rotate the key by adding a new secret
            # version and redeploying:
            #   gcloud secrets versions add caseops-openai-api-key \
            #     --project=__PROJECT_ID__ --data-file=-
            - name: CASEOPS_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: "caseops-openai-api-key"
                  key: "latest"
            # BUG-038 (Hari 2026-05-09): SendGrid Signed Event Webhook
            # ECDSA P-256 public key (base64-encoded DER). When set,
            # POST /api/webhooks/sendgrid/events fails closed on
            # invalid / missing signatures and on payloads SendGrid did
            # not sign. When the secret is missing in this env (cloud /
            # staging / production), the route returns 503 — never
            # silently accepts unsigned events. Rotate by:
            #   gcloud secrets versions add caseops-sendgrid-webhook-public-key \
            #     --project=__PROJECT_ID__ --data-file=- <<<"$NEW_KEY_B64"
            # then redeploy the API service. Provider-side enabling
            # (event types + URL + signing toggle) is documented in
            # docs/runbooks/sendgrid-event-webhook.md.
            - name: CASEOPS_SENDGRID_WEBHOOK_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: "caseops-sendgrid-webhook-public-key"
                  key: "latest"
            # Hari BUG-042/043 (2026-05-30): production case
            # search/bookmarking must use the documented eCourtsIndia
            # partner API, with the bearer token held only in Secret
            # Manager. Provider status remains configured=false if the
            # secret is not present.
            - name: CASEOPS_CASE_TRACKING_ENABLED
              value: "true"
            - name: CASEOPS_CASE_TRACKING_PROVIDER
              value: "ecourtsindia"
            - name: CASEOPS_ECOURTSINDIA_API_BASE_URL
              value: "https://webapi.ecourtsindia.com"
            - name: CASEOPS_ECOURTSINDIA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: "caseops-ecourtsindia-api-token"
                  key: "latest"
            # Browser automation and persistent QA/test workspaces may use
            # deterministic fixtures only. This list is also enforced by the
            # background poller, where there is no inbound test header.
            - name: CASEOPS_PAID_PROVIDER_BLOCKED_COMPANY_SLUGS
              value: "caseops-qa;caseops-ip-qa;test-legal;legal"
            # IPLF-054: repository capability is deployed fail-closed. Do not
            # add the provider token or enable this flag until the licensed
            # adapter runbook's legal, cost, retention, and budget gates pass.
            - name: CASEOPS_INDIAN_KANOON_ENABLED
              value: "false"
            - name: CASEOPS_INDIAN_KANOON_API_BASE_URL
              value: "https://api.indiankanoon.org"
            - name: CASEOPS_INDIAN_KANOON_DAILY_BUDGET_MINOR
              value: "0"
            - name: CASEOPS_INDIAN_KANOON_MONTHLY_BUDGET_MINOR
              value: "0"
            - name: CASEOPS_INDIAN_KANOON_RETENTION_DAYS
              value: "0"
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"
