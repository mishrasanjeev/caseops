name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Cancel in-flight runs for the same branch so a fast follow-up push
  # doesn't queue behind an already-obsolete build.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync API deps
        working-directory: apps/api
        run: uv sync --all-extras --dev

      - name: Ruff
        working-directory: apps/api
        run: uv run ruff check src tests

      - name: Pytest with coverage (P1-001 per-area gates)
        working-directory: apps/api
        run: uv run pytest -q --cov=caseops_api --cov-report=json:coverage.json --cov-report=term

      - name: Coverage gate (per-area thresholds)
        working-directory: apps/api
        # scripts/coverage_gate.py reads coverage.json + asserts each
        # tracked module is at or above its 2026-04-24 baseline.
        # Update baselines in scripts/coverage_gate.py only when the
        # module gains real test coverage; never ratchet down to make
        # CI green.
        run: uv run python ../../scripts/coverage_gate.py coverage.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.json
          retention-days: 14

  postgres-validation:
    # AQ-005 (2026-04-25): pgvector-backed validation suite. The bulk
    # of the API suite uses SQLite (fast, hermetic) but a small subset
    # of behavior depends on real Postgres semantics: pgvector + HNSW,
    # FK ON DELETE SET NULL, JSONB roundtrip, server_default=false,
    # and migrations under batch_alter_table on a real PG dialect.
    # See apps/api/tests/test_postgres_validation.py for what's covered.
    name: Postgres + pgvector validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        # pgvector-on-pg17 image — same backend version as prod Cloud SQL.
        # CI-only: POSTGRES_HOST_AUTH_METHOD=trust skips password auth
        # for in-network clients. The container is ephemeral + only
        # listens on the runner's localhost — no real-world exposure.
        # The earlier md5-auth setup (POSTGRES_PASSWORD=caseops_test)
        # worked for psql but psycopg failed with "password
        # authentication failed for user caseops" via the SQLAlchemy
        # URL — likely an interaction with how psycopg negotiates
        # auth methods against this image's pg_hba.conf. trust mode
        # sidesteps the negotiation entirely.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: caseops
          POSTGRES_DB: caseops_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caseops -d caseops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync API deps
        working-directory: apps/api
        run: uv sync --all-extras --dev

      - name: Enable pgvector extension on the test DB
        run: |
          # The pgvector image preinstalls the extension binary but each
          # database has to opt-in with CREATE EXTENSION. Idempotent.
          # No password needed — POSTGRES_HOST_AUTH_METHOD=trust above.
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql -h 127.0.0.1 -U caseops -d caseops_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Pytest -m postgres
        working-directory: apps/api
        env:
          # conftest.pg_engine reads CASEOPS_TEST_POSTGRES_URL.
          # alembic/env.py reads CASEOPS_DATABASE_URL via
          # get_settings().database_url and overwrites whatever the
          # alembic Config object had set. Both must point at the
          # same DB — otherwise alembic upgrade head connects to a
          # different URL than the test fixtures (and either fails or
          # migrates the wrong database).
          # Trust auth on the service container removes the password
          # from both URLs.
          CASEOPS_TEST_POSTGRES_URL: postgresql+psycopg://caseops@127.0.0.1:5432/caseops_test
          CASEOPS_DATABASE_URL: postgresql+psycopg://caseops@127.0.0.1:5432/caseops_test
          CASEOPS_ENV: ci
          CASEOPS_AUTH_SECRET: pg-validation-secret-at-least-32-bytes
        run: uv run pytest -q -m postgres tests/test_postgres_validation.py

  web:
    name: Web (typecheck + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Web typecheck
        run: npm run typecheck:web

      - name: Vitest with coverage (AQ-002 reliability + threshold ratchet)
        # AQ-002 (2026-04-25): replaced the bare `test:web` step with
        # the coverage variant. testTimeout=15_000 + thresholds wired
        # in apps/web/vitest.config.ts make this stable on Linux
        # runners. Failing this step is the gate — do not weaken
        # thresholds to make CI green; raise them only when real tests
        # cover more lines.
        run: npm run test:coverage --workspace @caseops/web

      - name: Upload web coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: |
            apps/web/coverage/coverage-summary.json
            apps/web/coverage/lcov.info
          retention-days: 14
          if-no-files-found: warn

      - name: Next build
        run: npm run build:web

  e2e:
    name: Playwright app suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - run: uv python install 3.13

      - run: npm ci

      - name: Sync API deps
        working-directory: apps/api
        run: uv sync --all-extras --dev

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Next build (reused by `next start` in playwright webServer)
        # NEXT_PUBLIC_* are baked at build time. Playwright opens pages on
        # http://127.0.0.1:3100 and the e2e API runs on http://127.0.0.1:8000.
        # Without this env, Next defaults the client bundle to
        # http://localhost:8000 — which means Set-Cookie scopes to host
        # `localhost` and JS on host `127.0.0.1` cannot read the
        # caseops_csrf cookie, so every mutating request fails CSRF.
        # Locally the same bug is masked by apps/web/.env.local.
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        run: npm run build:web

      - name: Playwright (app config)
        # playwright.app.config.ts probes for Windows Edge/Chrome paths on
        # the developer's workstation. On the Ubuntu runner those paths
        # don't exist, so `launchOptions` stays empty and Playwright uses
        # its bundled Chromium. No extra env needed.
        run: npm run test:e2e:app

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Staging deploy skeleton (Sprint 14 / BG-044).
  #
  # Guarded on explicit staging config so forks and contributors without GCP
  # credentials never trigger a deploy. Runs on `main` only, after api + web +
  # e2e all pass. Until the full API+Web runtime proof path is implemented, a
  # fully configured staging job fails closed before deployment instead of
  # silently performing an API-only deploy.
  #
  # When GCP credentials land, the secrets required for the current gate are:
  #   GCP_PROJECT_ID
  #   GCP_REGION
  #   GCP_WORKLOAD_IDENTITY_PROVIDER
  #   GCP_DEPLOY_SA (service account email with run.admin + artifactregistry.writer + cloudsql.client)
  #   CASEOPS_DATABASE_URL_STAGING
  # Additional staging auth/runtime secrets must exist in GCP Secret Manager
  # before the full staging deploy path can be enabled.
  deploy-staging:
    name: Cloud Run deploy (staging)
    runs-on: ubuntu-latest
    needs: [api, web, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 25
    permissions:
      contents: read
      # Required by google-github-actions/auth once staging Workload Identity is
      # configured. The staging gate skips before auth when config is absent.
      id-token: write
    steps:
      - name: Gate on staging deploy configuration
        id: credgate
        env:
          HAS_GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID != '' }}
          HAS_GCP_REGION: ${{ secrets.GCP_REGION != '' }}
          HAS_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
          HAS_GCP_DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA != '' }}
          HAS_CASEOPS_DATABASE_URL_STAGING: ${{ secrets.CASEOPS_DATABASE_URL_STAGING != '' }}
        run: |
          missing=()
          [ "$HAS_GCP_PROJECT_ID" = "true" ] || missing+=("GCP_PROJECT_ID")
          [ "$HAS_GCP_REGION" = "true" ] || missing+=("GCP_REGION")
          [ "$HAS_GCP_WORKLOAD_IDENTITY_PROVIDER" = "true" ] || missing+=("GCP_WORKLOAD_IDENTITY_PROVIDER")
          [ "$HAS_GCP_DEPLOY_SA" = "true" ] || missing+=("GCP_DEPLOY_SA")
          [ "$HAS_CASEOPS_DATABASE_URL_STAGING" = "true" ] || missing+=("CASEOPS_DATABASE_URL_STAGING")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Staging deploy skipped because required config is missing:"
            printf '  - %s\n' "${missing[@]}"
            {
              echo "### Staging deploy skipped"
              echo
              echo "Required config is missing:"
              printf -- "- %s\n" "${missing[@]}"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "deploy=skip" >> "$GITHUB_OUTPUT"
          else
            echo "Required staging deploy config is present."
            echo "deploy=run" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail closed until full staging proof workflow exists
        if: steps.credgate.outputs.deploy == 'run'
        run: |
          echo "Staging deploy config is present, but the workflow still lacks full API+Web runtime proof."
          echo "Required before enabling deploy: staging web deploy, migration proof, API health, Web health, smoke proof, and SHA/revision capture."
          {
            echo "### Staging deploy blocked"
            echo
            echo "Required staging config is present, but the workflow is intentionally fail-closed until the full proof path exists."
            echo
            echo "Required proof before deploy enablement:"
            echo "- API image SHA and Cloud Run revision"
            echo "- Web image SHA and Cloud Run revision"
            echo "- Migration execution result"
            echo "- API health check"
            echo "- Web health check"
            echo "- Smoke test evidence"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Checkout
        if: steps.credgate.outputs.deploy == 'run'
        uses: actions/checkout@v4

      - name: Authenticate to GCP via Workload Identity
        if: steps.credgate.outputs.deploy == 'run'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up gcloud
        if: steps.credgate.outputs.deploy == 'run'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        if: steps.credgate.outputs.deploy == 'run'
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: Build + push container image
        if: steps.credgate.outputs.deploy == 'run'
        working-directory: apps/api
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/caseops/caseops-api:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Run Alembic migrations against staging
        if: steps.credgate.outputs.deploy == 'run'
        env:
          CASEOPS_DATABASE_URL: ${{ secrets.CASEOPS_DATABASE_URL_STAGING }}
        working-directory: apps/api
        run: |
          pipx install uv
          uv sync
          uv run alembic upgrade head

      - name: Deploy to Cloud Run (staging)
        if: steps.credgate.outputs.deploy == 'run'
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/caseops/caseops-api:${{ github.sha }}
        run: |
          gcloud run deploy caseops-api-staging \
            --image "$IMAGE" \
            --region "${{ secrets.GCP_REGION }}" \
            --platform managed \
            --service-account "${{ secrets.GCP_DEPLOY_SA }}" \
            --set-env-vars CASEOPS_ENV=staging,CASEOPS_OTEL_ENABLED=true,CASEOPS_LOG_FORMAT=json \
            --set-secrets CASEOPS_AUTH_SECRET=caseops-auth-secret:latest,CASEOPS_LLM_API_KEY=caseops-llm-api-key:latest \
            --no-allow-unauthenticated
