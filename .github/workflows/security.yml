# P1-005 (2026-04-24, QG-SEC-001/-002/-003/-004) — supply-chain
# security gates. CodeQL covers SAST in codeql.yml; this workflow
# covers the remaining gaps from the audit:
#
# - npm audit (JS dep vulnerabilities)
# - pip-audit / OSV equivalent (Python dep vulnerabilities)
# - gitleaks secret scan on every PR
# - license allow-list check
#
# Each job is a separate GitHub job so failures attribute clearly
# in the PR check list. None depend on Pine Labs /
# Voyage credentials.

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily at 04:30 UTC so newly-disclosed CVEs surface within 24h
    # even on a quiet weekend without any PRs.
    - cron: "30 4 * * *"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  npm-audit:
    name: npm audit (high+critical)
    runs-on: ubuntu-latest
    # Registry-backed install and advisory reads have exceeded ten minutes on
    # otherwise healthy GitHub runners. Keep the gate bounded, but give the
    # strict audit enough time to return a real pass/fail verdict.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # npm 10 still calls the retiring quick-audit endpoint, which rejects
      # modern optional-platform trees with HTTP 400. Pin npm 11 so the gate
      # uses the supported bulk-advisory endpoint. High + critical findings
      # still fail; moderate findings remain visible for triage. Retry only
      # recognized transport failures inside a short network budget. If the
      # npm advisory service remains unreachable, a digest-pinned official
      # OSV Scanner must return a clean package-lock scan; vulnerability and
      # all other npm failures remain immediately release-blocking.
      - name: Run strict npm audit
        run: |
          for attempt in 1 2 3; do
            set +e
            npx --yes --prefer-offline npm@11.6.2 audit \
              --audit-level=high \
              --fetch-timeout=120000 \
              --fetch-retries=1 2>&1 | tee npm-audit.log
            audit_status=${PIPESTATUS[0]}
            set -e

            if [ "$audit_status" -eq 0 ]; then
              exit 0
            fi

            if ! grep -Eqi \
              'audit endpoint returned an error|network timeout|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENETUNREACH|ETIMEDOUT' \
              npm-audit.log; then
              echo "npm audit returned a non-network failure; refusing fallback."
              exit "$audit_status"
            fi

            if [ "$attempt" -eq 3 ]; then
              break
            fi
            sleep $((attempt * 10))
          done

          echo "npm advisory transport unavailable; running strict OSV lockfile fallback."
          docker run --rm \
            -v "$PWD:/src" \
            ghcr.io/google/osv-scanner:v2.5.0@sha256:5b8b38e45bb2c5c4976f0f1f07860551ea6e1f235f642cf215f74d266fec2c1b \
            scan source --lockfile=/src/package-lock.json

  pip-audit:
    name: pip-audit (high+critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.13
      - name: Sync API deps
        working-directory: apps/api
        run: uv sync --frozen --no-install-project
      - name: Install pip-audit
        run: uv tool install pip-audit
      # Audit every installed distribution, including the metadata-only local
      # FastEmbed wheel under its unchanged upstream name/version. Re-resolving
      # freeze output would substitute PyPI metadata for the installed rebuild.
      # Dependency validation and strict OSV failures remain release-blocking.
      - name: Run pip-audit
        working-directory: apps/api
        run: |
          uv pip check
          site_packages="$(.venv/bin/python -c 'import sysconfig; paths = sysconfig.get_paths(); assert paths["purelib"] == paths["platlib"]; print(paths["purelib"])')"
          uv tool run pip-audit \
            --strict \
            --vulnerability-service osv \
            --path "$site_packages"

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The action's --no-merges --first-parent range can scan zero bytes after
      # a normal main merge. Scan immutable tracked blobs plus all side-parent
      # history, including merge-resolution diffs, and retain nonempty receipts.
      - name: Load reviewed Gitleaks image
        run: docker pull ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
      - name: Native offline secret-scan regressions
        env:
          CASEOPS_SECRET_SCAN_TEST_EVIDENCE: ${{ runner.temp }}/secret-scan-regressions
        run: python3 -B -m unittest discover -s scripts/tests -p test_secret_scan_gate.py -v
      - name: Gitleaks tracked tree and changed history
        env:
          SCAN_HEAD: ${{ github.sha }}
        run: |
          python3 -B scripts/security_secret_scan.py \
            --head "$SCAN_HEAD" --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" \
            --output "$RUNNER_TEMP/secret-scan-evidence"
      - name: Retain native secret-scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-native
          path: |
            ${{ runner.temp }}/secret-scan-evidence
            ${{ runner.temp }}/secret-scan-regressions
          if-no-files-found: error

  license-allowlist:
    name: License allow-list
    runs-on: ubuntu-latest
    # The allow-list remains fail-closed; this budget covers a slow npm
    # registry without cancelling the scanner before it emits its verdict.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # The private root has no production dependencies; license-checker's
      # legacy --production traversal ignores hoisted npm workspaces. Select
      # installed production identities, including copied foreign optionals.
      # Host coverage is not coverage of the shipped Linux x64 musl runtime.
      # Actual musl artifact coverage and target-platform CI remain separate gates.
      - name: Check host-installed JS production licenses
        env:
          CASEOPS_JS_LICENSE_EVIDENCE: ${{ runner.temp }}/js-license-evidence
        run: |
          set -eu
          mkdir -p "$CASEOPS_JS_LICENSE_EVIDENCE"
          audit="$RUNNER_TEMP/license-audit-host"
          npm install --prefix "$audit" --ignore-scripts --no-audit --no-fund \
            --save-exact license-checker@25.0.1
          export PATH="$audit/node_modules/.bin:$PATH"
          export CASEOPS_LICENSE_CHECKER_PACKAGE="$audit/node_modules/license-checker/package.json"
          python3 -B -m unittest discover -s scripts/tests -p test_js_license_coverage.py -v
          output="$CASEOPS_JS_LICENSE_EVIDENCE/host"
          python3 -B scripts/check_js_license_coverage.py inventory --output "$output"
          packages="$(cat "$output/packages.txt")"
          license-checker --json --packages "$packages" > "$output/license-report.json"
          python3 -B scripts/check_js_license_coverage.py verify --output "$output" --review-root "$GITHUB_WORKSPACE"
      # Independent of host policy success: inspect the same install-scripts/prune
      # stage copied into the shipped runner. Audit tools mutate only a disposable
      # root container, never the production Dockerfile or /app dependency tree.
      - name: Audit actual pruned Linux x64 musl production licenses
        if: ${{ always() && !cancelled() }}
        env:
          CASEOPS_JS_LICENSE_EVIDENCE: ${{ runner.temp }}/js-license-evidence
        run: |
          set -eu
          output="$CASEOPS_JS_LICENSE_EVIDENCE/musl"
          mkdir -p "$output"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > "$output/checkout-sha.txt"
          image="caseops-js-license-musl:$GITHUB_SHA"
          set +e
          docker build --platform linux/amd64 --file apps/web/Dockerfile \
            --target prod-deps --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image" --iidfile "$output/image-id.txt" . 2>&1 | tee "$output/build.log"
          build_status=${PIPESTATUS[0]}
          set -e
          printf '{"exit_code":%s}\n' "$build_status" > "$output/build-completion.json"
          if [ "$build_status" -ne 0 ]; then exit "$build_status"; fi
          docker image inspect "$image" > "$output/image-inspect.json"
          image_id="$(cat "$output/image-id.txt")"
          test "$(docker image inspect --format '{{.Id}}' "$image")" = "$image_id"
          set +e
          docker run --rm -i --user 0 --workdir /app \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/check_js_license_coverage.py,dst=/license-guard/check_js_license_coverage.py,readonly" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/reviewed-source,readonly" \
            --mount "type=bind,src=$output,dst=/evidence" \
            "$image_id" sh -eu <<'AUDIT' 2>&1 | tee "$output/container.log"
          trap 'status=$?; printf "{\"exit_code\":%s}\n" "$status" > /evidence/container-completion.json' EXIT
          apk add --no-cache python3
          npm install --prefix /license-audit --cache /license-audit/npm-cache \
            --ignore-scripts --no-audit --no-fund --save-exact license-checker@25.0.1
          cp /license-audit/package-lock.json /evidence/scanner-package-lock.json
          export PATH="/license-audit/node_modules/.bin:$PATH"
          export CASEOPS_LICENSE_CHECKER_PACKAGE=/license-audit/node_modules/license-checker/package.json
          python3 -B /license-guard/check_js_license_coverage.py inventory --root /app \
            --require-platform linux-x64-musl --require-pruned-tree --output /evidence/scan
          packages="$(cat /evidence/scan/packages.txt)"
          license-checker --start /app --json --packages "$packages" > /evidence/scan/license-report.json
          python3 -B /license-guard/check_js_license_coverage.py verify --root /app \
            --require-platform linux-x64-musl --require-pruned-tree --output /evidence/scan --review-root /reviewed-source
          AUDIT
          audit_status=${PIPESTATUS[0]}
          set -e
          printf '{"exit_code":%s}\n' "$audit_status" > "$output/run-completion.json"
          exit "$audit_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: js-license-report
          path: ${{ runner.temp }}/js-license-evidence
          if-no-files-found: error

  openapi-client-drift:
    name: OpenAPI -> generated client clean diff (QG-API-012, P1-010)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.13
      - name: Sync API deps
        working-directory: apps/api
        run: uv sync --frozen --no-install-project
      - name: Dump current OpenAPI from FastAPI app
        run: uv --directory apps/api run --no-sync python ../../scripts/dump_openapi.py /tmp/openapi.json
      - name: Regenerate web/lib/api/openapi-types.ts
        run: >-
          npx --yes openapi-typescript@7.13.0 --alphabetize
          /tmp/openapi.json --output apps/web/lib/api/openapi-types.ts
      - name: Fail if regenerated types differ from committed types
        run: |
          if ! git diff --quiet -- apps/web/lib/api/openapi-types.ts; then
            echo "::error::apps/web/lib/api/openapi-types.ts is stale. Run 'npm run gen:api-types --workspace @caseops/web' (or scripts/dump_openapi.py + openapi-typescript) and commit the regenerated file."
            git --no-pager diff -- apps/web/lib/api/openapi-types.ts
            exit 1
          fi

  manifest-no-literal-secrets:
    name: Cloud Run manifests use secret refs (QG-OPS-006)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a
        with:
          version: "latest"
      - name: Reject literal secrets in infra/cloudrun
        # Parse YAML env entries structurally so a secret-like name is
        # associated with its sibling value/valueFrom, and check every
        # scheduler-inventory bootstrap contract, whose environment the
        # reconciler applies verbatim. The old grep inspected only the
        # value line and could never see the name on the preceding line.
        run: >-
          uv run --no-project --with PyYAML==6.0.3
          python scripts/check_cloudrun_manifest_secrets.py infra/cloudrun

  license-workspace-lock-policy:
    name: JS workspace production lock policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Test the workspace license gate
        run: |
          node --test --test-reporter=tap --test-reporter-destination=license-gate-tests.tap \
            --test-reporter=junit --test-reporter-destination=license-gate-tests.xml \
            scripts/production-js-license-gate.test.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # This logical lock closure includes absent platform optionals. The
      # independent Python job inspects the physically shipped musl copies.
      - name: Check workspace production lock licenses
        run: |
          set +e
          npm ls --package-lock-only --omit=dev --all --long --json \
            --workspaces --include-workspace-root > license-lock-tree.json 2> license-lock-tree.stderr
          lock_status=$?
          npm ls --omit=dev --all --long --json \
            --workspaces --include-workspace-root > license-installed-tree.json 2> license-installed-tree.stderr
          installed_status=$?
          set -e
          node scripts/production-js-license-gate.mjs \
            --root . --review-root "$GITHUB_WORKSPACE" --source-sha "$(git rev-parse HEAD)" \
            --lock-tree license-lock-tree.json --lock-exit "$lock_status" \
            --installed-tree license-installed-tree.json --installed-exit "$installed_status" \
            --output license-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: js-license-workspace-lock-report
          if-no-files-found: error
          path: |
            license-report.json
            license-lock-tree.json
            license-lock-tree.stderr
            license-installed-tree.json
            license-installed-tree.stderr
            license-gate-tests.tap
            license-gate-tests.xml

  web-upload-context:
    name: Native Cloud Build web upload context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
        with:
          version: "568.0.0"
      - name: Verify native upload inventory without credentials or uploads
        env:
          CASEOPS_WEB_UPLOAD_EVIDENCE: ${{ runner.temp }}/web-upload-context
        run: python3 -B -m unittest discover -s scripts/tests -p test_web_upload_context.py -v
      - name: Retain native upload and exclusion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-upload-context-native
          path: ${{ runner.temp }}/web-upload-context
          if-no-files-found: error
