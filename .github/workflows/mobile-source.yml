name: Mobile source gates

on:
  pull_request:
    branches: [main]
    paths: ["package.json", "package-lock.json", "apps/mobile/**", "apps/api/**", "apps/web/**", "tests/e2e/support/**", "tests/mobile-web-auth/**", "scripts/mobile/**", "playwright.mobile-handoff.config.ts", "tsconfig.e2e.json", ".github/workflows/mobile-source.yml", ".github/actions/node-trust/**"]
  push:
    branches: [main]
    paths: ["package.json", "package-lock.json", "apps/mobile/**", "apps/api/**", "apps/web/**", "tests/e2e/support/**", "tests/mobile-web-auth/**", "scripts/mobile/**", "playwright.mobile-handoff.config.ts", "tsconfig.e2e.json", ".github/workflows/mobile-source.yml", ".github/actions/node-trust/**"]

permissions:
  contents: read

concurrency:
  group: mobile-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-closure:
    name: Installed mobile dependency audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      CASEOPS_MOBILE_DEPENDENCY_SCOPE: mobile-only
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    defaults:
      run:
        shell: pwsh
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: ./.github/actions/node-trust
        id: node_trust
      - name: Protect the exact pinned public npm archive on Windows
        if: runner.os == 'Windows'
        shell: powershell
        timeout-minutes: 1
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:GITHUB_WORKSPACE 'apps/mobile/vendor/npm-11.12.1-caseops-security/npm-11.12.1-caseops-security.tgz'
          $item = Get-Item -LiteralPath $archive -Force
          if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or $item.Length -ne 4043346) { throw 'NPM_ARCHIVE_TYPE_OR_EXTENT' }
          $rights = [Security.AccessControl.FileSystemRights]::Read -bor [Security.AccessControl.FileSystemRights]::ChangePermissions
          $stream = [IO.FileStream]::new($archive, [IO.FileMode]::Open, $rights, [IO.FileShare]::Read, 4096, [IO.FileOptions]::None)
          $hash = [Security.Cryptography.SHA256]::Create()
          try {
            $expected = 'fcfa9290ee0acca362be71768de3dcc591f6af00622270529e70fbb25b831052'
            $actual = [BitConverter]::ToString($hash.ComputeHash($stream)).Replace('-', '').ToLowerInvariant()
            if ($actual -ne $expected) { throw 'NPM_ARCHIVE_DIGEST' }
            $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
            $acl = [Security.AccessControl.FileSecurity]::new()
            $acl.SetAccessRuleProtection($true, $false)
            foreach ($sid in @($identity.User.Value, 'S-1-5-18', 'S-1-5-32-544')) {
              $principal = [Security.Principal.SecurityIdentifier]::new($sid)
              $rule = [Security.AccessControl.FileSystemAccessRule]::new($principal, [Security.AccessControl.FileSystemRights]::FullControl, [Security.AccessControl.AccessControlType]::Allow)
              $acl.AddAccessRule($rule)
            }
            $stream.SetAccessControl($acl)
            if (-not $stream.GetAccessControl().AreAccessRulesProtected) { throw 'NPM_ARCHIVE_ACL_NOT_PROTECTED' }
            $stream.Position = 0
            $actual = [BitConverter]::ToString($hash.ComputeHash($stream)).Replace('-', '').ToLowerInvariant()
            if ($actual -ne $expected -or $stream.Length -ne 4043346) { throw 'NPM_ARCHIVE_CHANGED' }
            Write-Output 'Protected only the held, digest-pinned public npm archive; installer ACL checks remain mandatory.'
          } finally { $hash.Dispose(); $stream.Dispose() }
      - name: Install this platform's exact locked mobile graph
        env:
          NODE_OPTIONS: ${{ steps.node_trust.outputs.NODE_OPTIONS }}
          SSL_CERT_FILE: ${{ steps.node_trust.outputs.SSL_CERT_FILE }}
          SSL_CERT_DIR: ${{ steps.node_trust.outputs.SSL_CERT_DIR }}
          CASEOPS_HOST_NODE_TRUST_POLICY_FILE: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_FILE }}
          CASEOPS_HOST_NODE_TRUST_POLICY_SHA256: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_SHA256 }}
          NPM_CONFIG_USERCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_USERCONFIG }}
          NPM_CONFIG_GLOBALCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_GLOBALCONFIG }}
          NPM_CONFIG_STRICT_SSL: ${{ steps.node_trust.outputs.NPM_CONFIG_STRICT_SSL }}
          NPM_CONFIG_REGISTRY: ${{ steps.node_trust.outputs.NPM_CONFIG_REGISTRY }}
        run: node ../../scripts/mobile/npm-tooling.mjs ci --no-audit --no-fund
      - name: Retain this platform's full installed dependency inventory
        env:
          NODE_OPTIONS: ${{ steps.node_trust.outputs.NODE_OPTIONS }}
          SSL_CERT_FILE: ${{ steps.node_trust.outputs.SSL_CERT_FILE }}
          SSL_CERT_DIR: ${{ steps.node_trust.outputs.SSL_CERT_DIR }}
          CASEOPS_HOST_NODE_TRUST_POLICY_FILE: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_FILE }}
          CASEOPS_HOST_NODE_TRUST_POLICY_SHA256: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_SHA256 }}
          NPM_CONFIG_USERCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_USERCONFIG }}
          NPM_CONFIG_GLOBALCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_GLOBALCONFIG }}
          NPM_CONFIG_STRICT_SSL: ${{ steps.node_trust.outputs.NPM_CONFIG_STRICT_SSL }}
          NPM_CONFIG_REGISTRY: ${{ steps.node_trust.outputs.NPM_CONFIG_REGISTRY }}
        run: node ../../scripts/mobile/npm-tooling.mjs ls --all --json --long > installed-dependencies.json
      - name: Check the pinned installer dependency graph
        env:
          NODE_OPTIONS: ${{ steps.node_trust.outputs.NODE_OPTIONS }}
          SSL_CERT_FILE: ${{ steps.node_trust.outputs.SSL_CERT_FILE }}
          SSL_CERT_DIR: ${{ steps.node_trust.outputs.SSL_CERT_DIR }}
          CASEOPS_HOST_NODE_TRUST_POLICY_FILE: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_FILE }}
          CASEOPS_HOST_NODE_TRUST_POLICY_SHA256: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_SHA256 }}
          NPM_CONFIG_USERCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_USERCONFIG }}
          NPM_CONFIG_GLOBALCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_GLOBALCONFIG }}
          NPM_CONFIG_STRICT_SSL: ${{ steps.node_trust.outputs.NPM_CONFIG_STRICT_SSL }}
          NPM_CONFIG_REGISTRY: ${{ steps.node_trust.outputs.NPM_CONFIG_REGISTRY }}
        run: node ../../scripts/mobile/npm-tooling.mjs --cli-health > npm-cli-dependencies.json
      - name: Audit the pinned installer including embedded dependencies
        env:
          NODE_OPTIONS: ${{ steps.node_trust.outputs.NODE_OPTIONS }}
          SSL_CERT_FILE: ${{ steps.node_trust.outputs.SSL_CERT_FILE }}
          SSL_CERT_DIR: ${{ steps.node_trust.outputs.SSL_CERT_DIR }}
          CASEOPS_HOST_NODE_TRUST_POLICY_FILE: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_FILE }}
          CASEOPS_HOST_NODE_TRUST_POLICY_SHA256: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_SHA256 }}
          NPM_CONFIG_USERCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_USERCONFIG }}
          NPM_CONFIG_GLOBALCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_GLOBALCONFIG }}
          NPM_CONFIG_STRICT_SSL: ${{ steps.node_trust.outputs.NPM_CONFIG_STRICT_SSL }}
          NPM_CONFIG_REGISTRY: ${{ steps.node_trust.outputs.NPM_CONFIG_REGISTRY }}
        run: node ../../scripts/mobile/npm-tooling.mjs --audit-cli > npm-cli-audit.json
      - name: Verify installed parser and private backport identities and licences
        env:
          NODE_OPTIONS: ${{ steps.node_trust.outputs.NODE_OPTIONS }}
          SSL_CERT_FILE: ${{ steps.node_trust.outputs.SSL_CERT_FILE }}
          SSL_CERT_DIR: ${{ steps.node_trust.outputs.SSL_CERT_DIR }}
          CASEOPS_HOST_NODE_TRUST_POLICY_FILE: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_FILE }}
          CASEOPS_HOST_NODE_TRUST_POLICY_SHA256: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_SHA256 }}
          NPM_CONFIG_USERCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_USERCONFIG }}
          NPM_CONFIG_GLOBALCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_GLOBALCONFIG }}
          NPM_CONFIG_STRICT_SSL: ${{ steps.node_trust.outputs.NPM_CONFIG_STRICT_SSL }}
          NPM_CONFIG_REGISTRY: ${{ steps.node_trust.outputs.NPM_CONFIG_REGISTRY }}
        run: node --test ../../scripts/mobile/forge-security.test.mjs ../../scripts/mobile/deepmerge-installed.test.mjs ../../scripts/mobile/npm-tooling.test.mjs
      - name: Audit this platform's full installed graph without an exception
        env:
          NODE_OPTIONS: ${{ steps.node_trust.outputs.NODE_OPTIONS }}
          SSL_CERT_FILE: ${{ steps.node_trust.outputs.SSL_CERT_FILE }}
          SSL_CERT_DIR: ${{ steps.node_trust.outputs.SSL_CERT_DIR }}
          CASEOPS_HOST_NODE_TRUST_POLICY_FILE: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_FILE }}
          CASEOPS_HOST_NODE_TRUST_POLICY_SHA256: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_SHA256 }}
          NPM_CONFIG_USERCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_USERCONFIG }}
          NPM_CONFIG_GLOBALCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_GLOBALCONFIG }}
          NPM_CONFIG_STRICT_SSL: ${{ steps.node_trust.outputs.NPM_CONFIG_STRICT_SSL }}
          NPM_CONFIG_REGISTRY: ${{ steps.node_trust.outputs.NPM_CONFIG_REGISTRY }}
        run: node ../../scripts/mobile/npm-tooling.mjs audit --audit-level=high --json > dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-installed-dependencies-${{ matrix.os }}
          path: |
            apps/mobile/installed-dependencies.json
            apps/mobile/dependency-audit.json
            apps/mobile/npm-cli-dependencies.json
            apps/mobile/npm-cli-audit.json
          if-no-files-found: error

  android-setup:
    name: Windows Android setup offline regressions, not device acceptance
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 complete offline inventory
        shell: powershell
        run: ./scripts/mobile/android-tooling.ps1 -SelfTest
      - name: PowerShell 7 complete offline inventory
        shell: pwsh
        run: ./scripts/mobile/android-tooling.ps1 -SelfTest
      - name: PowerShell 5.1 command-handle field regressions
        shell: powershell
        run: ./scripts/mobile/windows-command-handle.test.ps1
      - name: PowerShell 7 command-handle field regressions
        shell: pwsh
        run: ./scripts/mobile/windows-command-handle.test.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-setup-offline-results
          path: ${{ runner.temp }}/caseops-android-offline-*/results.jsonl
          if-no-files-found: error

  source:
    name: Mobile source, not device acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CASEOPS_MOBILE_AUTOMATED_TEST: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      PYTHON: "python3"
      CASEOPS_MOBILE_RELEASE_SHA: ${{ github.sha }}
      EXPO_PUBLIC_API_ORIGIN: http://127.0.0.1:8000
      EXPO_PUBLIC_WEB_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - uses: ./.github/actions/node-trust
        id: node_trust
      - name: Install the shared browser test dependency graph
        env:
          NODE_OPTIONS: ${{ steps.node_trust.outputs.NODE_OPTIONS }}
          SSL_CERT_FILE: ${{ steps.node_trust.outputs.SSL_CERT_FILE }}
          SSL_CERT_DIR: ${{ steps.node_trust.outputs.SSL_CERT_DIR }}
          CASEOPS_HOST_NODE_TRUST_POLICY_FILE: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_FILE }}
          CASEOPS_HOST_NODE_TRUST_POLICY_SHA256: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_SHA256 }}
          NPM_CONFIG_USERCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_USERCONFIG }}
          NPM_CONFIG_GLOBALCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_GLOBALCONFIG }}
          NPM_CONFIG_STRICT_SSL: ${{ steps.node_trust.outputs.NPM_CONFIG_STRICT_SSL }}
          NPM_CONFIG_REGISTRY: ${{ steps.node_trust.outputs.NPM_CONFIG_REGISTRY }}
        run: node scripts/mobile/npm-tooling.mjs ci --include=dev
      - name: Install the isolated native dependency graph
        env:
          NODE_OPTIONS: ${{ steps.node_trust.outputs.NODE_OPTIONS }}
          SSL_CERT_FILE: ${{ steps.node_trust.outputs.SSL_CERT_FILE }}
          SSL_CERT_DIR: ${{ steps.node_trust.outputs.SSL_CERT_DIR }}
          CASEOPS_HOST_NODE_TRUST_POLICY_FILE: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_FILE }}
          CASEOPS_HOST_NODE_TRUST_POLICY_SHA256: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_SHA256 }}
          NPM_CONFIG_USERCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_USERCONFIG }}
          NPM_CONFIG_GLOBALCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_GLOBALCONFIG }}
          NPM_CONFIG_STRICT_SSL: ${{ steps.node_trust.outputs.NPM_CONFIG_STRICT_SSL }}
          NPM_CONFIG_REGISTRY: ${{ steps.node_trust.outputs.NPM_CONFIG_REGISTRY }}
        working-directory: apps/mobile
        run: node ../../scripts/mobile/npm-tooling.mjs ci
      - name: Select official HTTPS Ubuntu archives for browser prerequisites
        run: |
          python3 - <<'PY_ARCHIVES'
          from pathlib import Path
          import os, stat, subprocess
          mirrors = Path('/etc/apt/apt-mirrors.txt')
          original = ('http://azure.archive.ubuntu.com/ubuntu/\tpriority:1\n'
                      'https://archive.ubuntu.com/ubuntu/\tpriority:2\n'
                      'https://security.ubuntu.com/ubuntu/\tpriority:3\n')
          approved = ('https://archive.ubuntu.com/ubuntu/\tpriority:1\n'
                      'https://security.ubuntu.com/ubuntu/\tpriority:2\n')
          info = mirrors.lstat()
          assert stat.S_ISREG(info.st_mode) and info.st_uid == 0 and not info.st_mode & 0o022
          assert mirrors.read_text() == original, 'UNREVIEWED_UBUNTU_MIRROR_CONFIGURATION'
          subprocess.run(['sudo', 'tee', str(mirrors)], input=approved, text=True,
                         stdout=subprocess.DEVNULL, check=True, timeout=10)
          assert mirrors.read_text() == approved, 'UBUNTU_MIRROR_WRITE_MISMATCH'
          print('Selected official HTTPS Ubuntu archives; package signature policy unchanged.')
          PY_ARCHIVES
      - name: Install the locked Chromium test browser
        env:
          NODE_OPTIONS: ${{ steps.node_trust.outputs.NODE_OPTIONS }}
          SSL_CERT_FILE: ${{ steps.node_trust.outputs.SSL_CERT_FILE }}
          SSL_CERT_DIR: ${{ steps.node_trust.outputs.SSL_CERT_DIR }}
          CASEOPS_HOST_NODE_TRUST_POLICY_FILE: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_FILE }}
          CASEOPS_HOST_NODE_TRUST_POLICY_SHA256: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_SHA256 }}
          NPM_CONFIG_USERCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_USERCONFIG }}
          NPM_CONFIG_GLOBALCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_GLOBALCONFIG }}
          NPM_CONFIG_STRICT_SSL: ${{ steps.node_trust.outputs.NPM_CONFIG_STRICT_SSL }}
          NPM_CONFIG_REGISTRY: ${{ steps.node_trust.outputs.NPM_CONFIG_REGISTRY }}
        run: node scripts/mobile/npm-tooling.mjs --npx --no-install playwright install --with-deps chromium
      - name: Type-check both platform adapters
        env:
          NODE_OPTIONS: ${{ steps.node_trust.outputs.NODE_OPTIONS }}
          SSL_CERT_FILE: ${{ steps.node_trust.outputs.SSL_CERT_FILE }}
          SSL_CERT_DIR: ${{ steps.node_trust.outputs.SSL_CERT_DIR }}
          CASEOPS_HOST_NODE_TRUST_POLICY_FILE: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_FILE }}
          CASEOPS_HOST_NODE_TRUST_POLICY_SHA256: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_SHA256 }}
          NPM_CONFIG_USERCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_USERCONFIG }}
          NPM_CONFIG_GLOBALCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_GLOBALCONFIG }}
          NPM_CONFIG_STRICT_SSL: ${{ steps.node_trust.outputs.NPM_CONFIG_STRICT_SSL }}
          NPM_CONFIG_REGISTRY: ${{ steps.node_trust.outputs.NPM_CONFIG_REGISTRY }}
        working-directory: apps/mobile
        run: node ../../scripts/mobile/npm-tooling.mjs run typecheck
      - name: Run the full mobile source inventory
        env:
          NODE_OPTIONS: ${{ steps.node_trust.outputs.NODE_OPTIONS }}
          SSL_CERT_FILE: ${{ steps.node_trust.outputs.SSL_CERT_FILE }}
          SSL_CERT_DIR: ${{ steps.node_trust.outputs.SSL_CERT_DIR }}
          CASEOPS_HOST_NODE_TRUST_POLICY_FILE: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_FILE }}
          CASEOPS_HOST_NODE_TRUST_POLICY_SHA256: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_SHA256 }}
          NPM_CONFIG_USERCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_USERCONFIG }}
          NPM_CONFIG_GLOBALCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_GLOBALCONFIG }}
          NPM_CONFIG_STRICT_SSL: ${{ steps.node_trust.outputs.NPM_CONFIG_STRICT_SSL }}
          NPM_CONFIG_REGISTRY: ${{ steps.node_trust.outputs.NPM_CONFIG_REGISTRY }}
        working-directory: apps/mobile
        run: node ../../scripts/mobile/npm-tooling.mjs test
      - name: Verify the native evidence harness
        env:
          NODE_OPTIONS: ${{ steps.node_trust.outputs.NODE_OPTIONS }}
          SSL_CERT_FILE: ${{ steps.node_trust.outputs.SSL_CERT_FILE }}
          SSL_CERT_DIR: ${{ steps.node_trust.outputs.SSL_CERT_DIR }}
          CASEOPS_HOST_NODE_TRUST_POLICY_FILE: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_FILE }}
          CASEOPS_HOST_NODE_TRUST_POLICY_SHA256: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_SHA256 }}
          NPM_CONFIG_USERCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_USERCONFIG }}
          NPM_CONFIG_GLOBALCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_GLOBALCONFIG }}
          NPM_CONFIG_STRICT_SSL: ${{ steps.node_trust.outputs.NPM_CONFIG_STRICT_SSL }}
          NPM_CONFIG_REGISTRY: ${{ steps.node_trust.outputs.NPM_CONFIG_REGISTRY }}
        run: node --test scripts/mobile/build-config.test.mjs scripts/mobile/tooling.test.mjs scripts/mobile/local-owner-controls.test.mjs apps/mobile/e2e/files-20261025.test.mjs apps/mobile/e2e/ios-files.test.mjs apps/mobile/e2e/android-files.test.mjs scripts/mobile/ios-browser-context.test.mjs scripts/mobile/ios-native-locators.test.mjs scripts/mobile/ios-simulator-signing.test.mjs scripts/mobile/prepare-gateway-routes.test.mjs scripts/mobile/prepare-ios-local-run.test.mjs scripts/mobile/ios-files-privacy.test.mjs scripts/mobile/camera-files-privacy.test.mjs scripts/mobile/run-ios-files.test.mjs scripts/mobile/filesystem-security.test.mjs apps/mobile/e2e/evidence.test.mjs scripts/mobile/build-android-local-acceptance.test.mjs scripts/mobile/android-native-proof.test.mjs scripts/mobile/prepare-android-local-run.test.mjs scripts/mobile/android-files-privacy.test.mjs scripts/mobile/run-android-files.test.mjs scripts/mobile/store-packaging.test.mjs scripts/mobile/store-artifact-postflight.test.mjs scripts/mobile/store-packaging-execution.test.mjs scripts/mobile/forge-security.test.mjs scripts/mobile/deepmerge-security.test.mjs scripts/mobile/deepmerge-installed.test.mjs scripts/mobile/npm-tooling.test.mjs scripts/mobile/privacy-policy.test.mjs scripts/mobile/prepare-source-exports.test.mjs apps/mobile/e2e/v1-workflows.test.mjs scripts/mobile/v1-workflows-credentials.test.mjs apps/mobile/e2e/queue-privacy.test.mjs scripts/mobile/client-extensions.test.mjs scripts/mobile/android-qa-observer.test.mjs scripts/mobile/android-qa-observer-build.test.mjs
      - name: Verify guarded local store packaging child transport
        run: python3 scripts/mobile/store-packaging-host.test.py
      - name: Verify QA-only Android observer merged manifest projection
        run: python3 scripts/mobile/android-observer-manifest.test.py
      - name: Verify isolated fixture preparation and gateway
        run: python3 scripts/mobile/local-fixture.test.py
      - name: Verify deterministic private deepmerge package
        run: python3 scripts/mobile/rebuild-deepmerge-compat.test.py
      - name: Verify disabled-by-default synthetic V1 controls
        run: python3 scripts/mobile/local-v1-controls.test.py
      - name: Verify separate queue and account-request controls
        run: python3 scripts/mobile/local-queue-privacy-controls.test.py
      - name: Verify independent queue and account-request inventory
        run: python3 scripts/mobile/queue-privacy.test.py
      - name: Verify isolated native client extension controls
        run: python3 scripts/mobile/local-client-extension-controls.test.py
      - name: Verify native client extension fixture producer
        run: python3 scripts/mobile/client-extension-fixture.test.py
      - name: Verify independent native client extension inventory
        run: python3 scripts/mobile/client-extensions.test.py
      - name: Verify the scoped canonical in-app Inbox fixture worker
        run: python3 scripts/mobile/local-v1-inbox.test.py
      - name: Verify the independent complete V1 source inventory
        run: python3 scripts/mobile/v1-workflows.test.py
      - name: Verify synthetic iOS Files picker inputs
        run: python3 scripts/mobile/prepare-ios-files-fixture.test.py
      - name: Verify acknowledged iOS Files source admission
        run: python3 scripts/mobile/admit-ios-file-source.test.py
      - name: Verify synthetic Android Files picker inputs
        run: python3 scripts/mobile/prepare-android-files-fixture.test.py
      - name: Verify acknowledged Android Files source admission
        run: python3 scripts/mobile/admit-android-file-source.test.py
      - name: Verify scoped host Python and Java trust contracts
        run: python3 scripts/mobile/host-platform-trust.test.py
      - name: Enforce the unwaived high-severity dependency gate
        env:
          NODE_OPTIONS: ${{ steps.node_trust.outputs.NODE_OPTIONS }}
          SSL_CERT_FILE: ${{ steps.node_trust.outputs.SSL_CERT_FILE }}
          SSL_CERT_DIR: ${{ steps.node_trust.outputs.SSL_CERT_DIR }}
          CASEOPS_HOST_NODE_TRUST_POLICY_FILE: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_FILE }}
          CASEOPS_HOST_NODE_TRUST_POLICY_SHA256: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_SHA256 }}
          NPM_CONFIG_USERCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_USERCONFIG }}
          NPM_CONFIG_GLOBALCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_GLOBALCONFIG }}
          NPM_CONFIG_STRICT_SSL: ${{ steps.node_trust.outputs.NPM_CONFIG_STRICT_SSL }}
          NPM_CONFIG_REGISTRY: ${{ steps.node_trust.outputs.NPM_CONFIG_REGISTRY }}
        working-directory: apps/mobile
        run: node ../../scripts/mobile/npm-tooling.mjs audit --audit-level=high
      - name: Prepare loopback-only source-export inputs
        env:
          NODE_OPTIONS: ${{ steps.node_trust.outputs.NODE_OPTIONS }}
          SSL_CERT_FILE: ${{ steps.node_trust.outputs.SSL_CERT_FILE }}
          SSL_CERT_DIR: ${{ steps.node_trust.outputs.SSL_CERT_DIR }}
          CASEOPS_HOST_NODE_TRUST_POLICY_FILE: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_FILE }}
          CASEOPS_HOST_NODE_TRUST_POLICY_SHA256: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_SHA256 }}
          NPM_CONFIG_USERCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_USERCONFIG }}
          NPM_CONFIG_GLOBALCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_GLOBALCONFIG }}
          NPM_CONFIG_STRICT_SSL: ${{ steps.node_trust.outputs.NPM_CONFIG_STRICT_SSL }}
          NPM_CONFIG_REGISTRY: ${{ steps.node_trust.outputs.NPM_CONFIG_REGISTRY }}
          CASEOPS_MOBILE_SOURCE_EXPORT: "1"
        run: node scripts/mobile/prepare-source-exports.mjs >> "$GITHUB_ENV"
      - name: Export Android JavaScript, not an APK
        working-directory: apps/mobile
