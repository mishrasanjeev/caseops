name: NONRELEASE watch UUID provenance diagnostic

# Branch-only diagnostic control plane. No deploy, HMAC, fourteen-role verdict,
# readiness writer or scheduler resume. The watch case mutates only its stamped
# synthetic QA profile and hit. No invoice or specialist case is selected.
on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: Exact serving M; diagnostics never deploy their branch
        required: true
        type: string
      diagnostic_ack:
        description: Enter scoped-owned-watch-qa-mutations-only
        required: true
        type: string

permissions:
  contents: read
  actions: read
cache-mode: none
concurrency:
  # Share canonical mutating-dispatch admission without cancelling its owner.
  # A newer canonical run can cancel this diagnostic: that is incomplete evidence.
  group: prod-verify-workflow_dispatch
  cancel-in-progress: false

jobs:
  scoped-failure-diagnostics:
    name: NONRELEASE one original watch failure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CASEOPS_EXPECTED_RELEASE_SHA: bdd1480699222712475372690334659088629429
      CASEOPS_BATCH4_SAFE_DIAGNOSTICS: "1"
      CASEOPS_BATCH4_DIAGNOSTIC_MODE: scoped-failure-diagnostics
    steps:
      - name: Refuse every other branch mode or serving SHA
        env:
          REQUESTED_SHA: ${{ inputs.expected_release_sha }}
          DIAGNOSTIC_ACK: ${{ inputs.diagnostic_ack }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/codex/prod-batch4-diagnostics-20261104
          test "$REQUESTED_SHA" = bdd1480699222712475372690334659088629429
          test "$DIAGNOSTIC_ACK" = scoped-owned-watch-qa-mutations-only
          test "$GITHUB_REPOSITORY" = mishrasanjeev/caseops

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind diagnostic checkout and original source ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor bdd1480699222712475372690334659088629429 HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --name-only bdd1480699222712475372690334659088629429 HEAD > "$RUNNER_TEMP/diagnostic-paths"
          python - <<'PY'
          import os,pathlib
          allowed={'.github/workflows/prod-verify.yml','playwright.batch4-failure-diagnostics.config.ts','tests/e2e/support/batch4-safe-diagnostics.ts','tests/e2e/support/ram-bugs4.ts','tests/e2e/ram-2026-10-31-control-crawl.spec.ts','tests/e2e/ram-2026-10-31-invoice-pdf.spec.ts','tests/e2e/ram-2026-10-31-watch.spec.ts'}
          changed=set(pathlib.Path(os.environ['RUNNER_TEMP'],'diagnostic-paths').read_text().splitlines())
          if changed != allowed: raise SystemExit('DIAGNOSTIC_CHANGED_PATHS_REFUSED')
          PY

      - name: Prepare finite marked active-production-QA guard
        run: |
          cat > "$RUNNER_TEMP/guard-production-qa.py" <<'PY'
          import json,os,time,urllib.request
          start=time.monotonic()
          own=int(os.environ['GITHUB_RUN_ID'])
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,request,fp,code,msg,headers,newurl): return None
          opener=urllib.request.build_opener(NoRedirect())
          for status in ('queued','in_progress','requested','waiting','pending'):
              total=None;ids=[]
              for page in range(1,11):
                  if time.monotonic()-start>=60: raise SystemExit('QA_GUARD_DEADLINE_REFUSED')
                  url=f'https://api.github.com/repos/mishrasanjeev/caseops/actions/workflows/prod-verify.yml/runs?status={status}&per_page=100&page={page}'
                  request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','X-CaseOps-Automated-Test':'no-paid-providers'})
                  with opener.open(request,timeout=10) as response:
                      if response.status!=200: raise SystemExit('QA_GUARD_HTTP_STATUS_REFUSED')
                      raw=response.read(4*1024*1024+1)
                  if len(raw)>4*1024*1024: raise SystemExit('QA_GUARD_RESPONSE_BOUND_REFUSED')
                  body=json.loads(raw)
                  if total is None: total=body['total_count']
                  if type(total) is not int or not 0<=total<=1000 or body['total_count']!=total: raise SystemExit('QA_GUARD_PAGINATION_REFUSED')
                  ids.extend(row['id'] for row in body['workflow_runs'])
                  if len(ids)>=total: break
              if len(ids)!=total or len(set(ids))!=total or any(value!=own for value in ids): raise SystemExit('OTHER_PRODUCTION_QA_ACTIVE_REFUSED')
          print('MARKED_FINITE_ACTIVE_PRODUCTION_QA_GUARD_PASS')
          PY

      - name: Require no other active production QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/guard-production-qa.py"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - uses: ./.github/actions/node-trust
        id: node_trust
      - name: Export inherited reviewed Node trust
        env:
          NODE_OPTIONS: ${{ steps.node_trust.outputs.NODE_OPTIONS }}
          SSL_CERT_FILE: ${{ steps.node_trust.outputs.SSL_CERT_FILE }}
          SSL_CERT_DIR: ${{ steps.node_trust.outputs.SSL_CERT_DIR }}
          CASEOPS_HOST_NODE_TRUST_POLICY_FILE: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_FILE }}
          CASEOPS_HOST_NODE_TRUST_POLICY_SHA256: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_SHA256 }}
          NPM_CONFIG_USERCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_USERCONFIG }}
          NPM_CONFIG_GLOBALCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_GLOBALCONFIG }}
          NPM_CONFIG_STRICT_SSL: ${{ steps.node_trust.outputs.NPM_CONFIG_STRICT_SSL }}
          NPM_CONFIG_REGISTRY: ${{ steps.node_trust.outputs.NPM_CONFIG_REGISTRY }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const names=['NODE_OPTIONS','SSL_CERT_FILE','SSL_CERT_DIR','CASEOPS_HOST_NODE_TRUST_POLICY_FILE','CASEOPS_HOST_NODE_TRUST_POLICY_SHA256','NPM_CONFIG_USERCONFIG','NPM_CONFIG_GLOBALCONFIG','NPM_CONFIG_STRICT_SSL','NPM_CONFIG_REGISTRY'];
          if(process.version!=='v24.15.0')throw Error('NODE_IDENTITY_REFUSED');
          for(const name of names){const value=process.env[name];if(!value||/[\r\n]/.test(value))throw Error('TRUST_OUTPUT_REFUSED');fs.appendFileSync(process.env.GITHUB_ENV,name+'='+value+'\n');}
          NODE
      - name: Own locked dependency installation
        run: npm ci
      - name: Install pinned Playwright Chromium
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Compile complete E2E TypeScript
        run: npx tsc --noEmit -p tsconfig.e2e.json

      - name: Recheck sole QA window and exact serving M
        id: admitted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/guard-production-qa.py"
          python scripts/verify_deployed_release.py --expected-sha bdd1480699222712475372690334659088629429 --wait-seconds 30 --interval-seconds 5
          echo ready=true >> "$GITHUB_OUTPUT"

      - name: Prepare fresh bounded safe output and native redacted records
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { prepareBatch4DiagnosticOutput } from './tests/e2e/support/batch4-safe-diagnostics.ts';
          prepareBatch4DiagnosticOutput();
          NODE
          test ! -e test-results/prod-native-evidence/batch4-failure-diagnostics
          mkdir -p test-results/prod-native-evidence/batch4-failure-diagnostics

      - name: Run exactly one original watch case with private stdio suppressed
        id: native
        env:
          CASEOPS_RAM_PROD_SLUG: test-legal
          CASEOPS_RAM_PROD_EMAIL: ram@testfirm.com
          CASEOPS_RAM_PROD_PASSWORD: ${{ secrets.CASEOPS_TEST_LEGAL_PROD_PASSWORD }}
          PROD_BASE_URL: https://caseops.ai
          PROD_API_BASE_URL: https://api.caseops.ai
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,pathlib,subprocess,time
          root=pathlib.Path.cwd();folder=root/'test-results/prod-native-evidence/batch4-failure-diagnostics'
          if not os.environ.get('CASEOPS_RAM_PROD_PASSWORD','').strip(): raise SystemExit('APPROVED_QA_CREDENTIAL_MISSING')
          expected=[('ram-2026-10-31-watch.spec.ts',"BUG-014 journal capture: 'Class 45' with captured evidence is recorded, listed and shown on the hit; a bad class token is refused at its field")]
          argv=['node','node_modules/@playwright/test/cli.js','test','--config=playwright.batch4-failure-diagnostics.config.ts','--project=batch4-prod-chromium','--workers=1','--retries=0','--repeat-each=1','--output=test-results/batch4-diagnostic-private']
          def run(phase):
              env=dict(os.environ,CASEOPS_PW_EVIDENCE_PHASE=phase,CASEOPS_PW_EVIDENCE_INVOCATION='batch4-failure-diagnostics',CASEOPS_PW_EVIDENCE_JSON_FILE=str(folder/('native-discovery.json' if phase=='discovery' else 'native-results.json')),CASEOPS_PW_EVIDENCE_JUNIT_FILE=str(folder/'native-results.xml'))
              env.pop('GH_TOKEN',None)
              child=subprocess.Popen(argv+(['--list'] if phase=='discovery' else []),env=env,stdin=subprocess.DEVNULL,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              started=time.monotonic();limit=120 if phase=='discovery' else 25*60;errors=[]
              try: code=child.wait(timeout=limit)
              except subprocess.TimeoutExpired:
                  errors.append('original_native_acceptance_deadline_exceeded')
                  # Keep the SAME original handle until EOF. A late zero can
                  # never repair failed acceptance; outer job cancellation is incomplete.
                  code=child.wait()
              if time.monotonic()-started>=limit and not errors: errors.append('original_native_acceptance_deadline_exceeded')
              receipt={'purpose':'NONRELEASE_SCOPED_FAILURE_DIAGNOSTICS','phase':phase,'native_exit':code,'wrapper_exit':code if not errors else 1,'original_pid':child.pid,'original_handle_reaped':True,'acceptance_seconds':limit,'errors':errors,'seconds':time.monotonic()-started,'serving_sha':'bdd1480699222712475372690334659088629429','diagnostic_checkout':os.environ['GITHUB_SHA'],'canonical_release_qualification':False}
              with (folder/(phase+'-native-exit.json')).open('x') as stream:json.dump(receipt,stream,indent=2)
              return code if not errors else 1
          discovery=run('discovery')
          if discovery!=0: raise SystemExit(discovery)
          document=json.loads((folder/'native-discovery.json').read_bytes());found=[]
          def visit(value):
              if isinstance(value,dict):
                  if 'tests' in value and 'title' in value and 'file' in value:
                      for case in value['tests']:
                          if case.get('projectName')!='batch4-prod-chromium': raise SystemExit('DIAGNOSTIC_PROJECT_COLLECTION_REFUSED')
                          found.append((value['file'],value['title']))
                  for nested in value.values():visit(nested)
              elif isinstance(value,list):
                  for nested in value:visit(nested)
          visit(document.get('suites',[]))
          if found!=expected: raise SystemExit('EXACT_ONE_DIAGNOSTIC_CASE_REFUSED')
          # This observation supplements the Root-admitted exclusive QA window;
          # it is not an atomic lock or a claim that another workflow was paused.
          guard=subprocess.run(['python',str(pathlib.Path(os.environ['RUNNER_TEMP'])/'guard-production-qa.py')],stdin=subprocess.DEVNULL,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=70,check=False)
          if guard.returncode!=0: raise SystemExit('PRE_EXECUTION_QA_WINDOW_REFUSED')
          raise SystemExit(run('execution'))
          PY

      - name: Validate safe rows before any row upload
        id: safe
        if: always() && steps.admitted.outputs.ready == 'true'
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { validateBatch4DiagnosticOutput } from './tests/e2e/support/batch4-safe-diagnostics.ts';
          const summary=validateBatch4DiagnosticOutput();
          fs.writeFileSync('test-results/batch4-safe-summary.json',JSON.stringify(summary)+'\n',{flag:'wx'});
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'safe=true\n');
          if(summary.counts.watch_http===0||summary.counts.watch_uuid_provenance+summary.counts.watch_intake_error!==1||summary.counts.specialist_control!==0||summary.counts.invoice_line!==0)throw Error('WATCH_PROVENANCE_DIAGNOSTIC_KIND_INCOMPLETE');
          NODE
      - name: Recheck exact serving M after diagnostics
        if: always() && steps.admitted.outputs.ready == 'true'
        run: python scripts/verify_deployed_release.py --expected-sha bdd1480699222712475372690334659088629429 --wait-seconds 30 --interval-seconds 5

      - name: Upload validated safe rows only
        if: always() && steps.safe.outputs.safe == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NONRELEASE-batch4-safe-diagnostic-rows
          path: |
            test-results/batch4-safe/records-*.jsonl
            test-results/batch4-safe-summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload original privacy-redacted native records only
        if: always() && steps.admitted.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NONRELEASE-batch4-original-native-redacted
          path: |
            test-results/prod-native-evidence/batch4-failure-diagnostics/native-discovery.json
            test-results/prod-native-evidence/batch4-failure-diagnostics/native-results.json
            test-results/prod-native-evidence/batch4-failure-diagnostics/native-results.xml
            test-results/prod-native-evidence/batch4-failure-diagnostics/progress.jsonl
            test-results/prod-native-evidence/batch4-failure-diagnostics/discovery-native-exit.json
            test-results/prod-native-evidence/batch4-failure-diagnostics/execution-native-exit.json
          if-no-files-found: error
          retention-days: 7
