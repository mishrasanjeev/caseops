name: Prod verification (Playwright)

# Runs the brutal-honest prod-Playwright suite (tests/e2e/ram-batch-2026-04-26-prod.spec.ts)
# against the LIVE caseops.ai + api.caseops.ai surface using a real test
# user (Ram). Per .claude/skills/bug-fixing/SKILL.md "Brutal Honest Testing
# — No Manual QA Dependence": every fix verdict must name the spec line +
# commit SHA that proves it. This job is the canonical proof artifact.
#
# Triggers:
#   - on push to main: runs after a merge so newly-deployed code is
#     verified end-to-end on the live surface.
#   - schedule (every 6h): catches prod drift (data loss, provider
#     regressions, third-party API changes) between deploys.
#   - workflow_dispatch: manual trigger after a deploy.
#
# Prereq secret: RAM_TEST_PASSWORD (Ram's test account password on prod).
# Without it the job aborts with a clear message — does NOT silently
# skip and pass green.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch:

concurrency:
  # Two scheduled runs on the same prod surface contending for Ram's
  # session would race the storageState file. Cancel in-progress to
  # keep one run live at a time.
  group: prod-verify
  cancel-in-progress: false

jobs:
  prod-playwright:
    name: Prod-Playwright (ram-batch suite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Gate on RAM_TEST_PASSWORD secret
        # Fail loudly + early if the secret is missing. Without it the
        # setup project's signIn would fail anyway, but this makes the
        # diagnosis obvious in the run log instead of buried in a
        # Playwright timeout.
        env:
          RAM_TEST_PASSWORD: ${{ secrets.RAM_TEST_PASSWORD }}
        run: |
          if [ -z "$RAM_TEST_PASSWORD" ]; then
            echo "::error::RAM_TEST_PASSWORD secret is not configured."
            echo "Add it under repo Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run prod-Playwright suite (ram-batch)
        env:
          RAM_TEST_PASSWORD: ${{ secrets.RAM_TEST_PASSWORD }}
          # Optional overrides — defaults are baked into the spec
          # (https://caseops.ai + ram@testfirm.com + test-legal). Only
          # set these if your prod URLs / test user differ.
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
          PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          RAM_TEST_EMAIL: ${{ vars.RAM_TEST_EMAIL }}
          RAM_TEST_SLUG: ${{ vars.RAM_TEST_SLUG }}
        run: npx playwright test --config=playwright.prod-ram.config.ts --reporter=list

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prod-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
