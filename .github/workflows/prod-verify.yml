name: Prod verification (Playwright)

# Runs the brutal-honest prod-Playwright suites against the LIVE
# caseops.ai + api.caseops.ai surface using the dedicated
# CaseOps QA Bot workspace (caseops-qa). Every fix verdict must name the
# automated spec and exact commit SHA that prove it. This job is the canonical
# machine-owned proof artifact.
#
# Test infra has zero dependency on real-user credentials — see
# feedback_dedicated_test_account_no_real_users.md.
#
# Triggers:
#   - schedule (every 6h): catches prod drift (data loss, provider
#     regressions, third-party API changes) between deploys.
#   - workflow_dispatch: exact-release trigger from deploy-prod.sh after
#     API and web have both converged to the requested commit.
#
# Prereq secret: CASEOPS_QA_PASSWORD (the CaseOps QA Bot owner password
# on prod — generated 2026-04-27 during workspace bootstrap, held only
# in a password manager + this GitHub secret). Without it the job
# aborts with a clear message — does NOT silently skip and pass green.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: "Exact 40-character commit expected on both production services"
        required: true
        type: string
      run_historical_a0_gate:
        description: "Run the archived IPLF-027B predecessor-fixture acceptance"
        required: false
        default: false
        type: boolean

concurrency:
  # Scheduled verification is read-only and must not cancel an exact-release
  # dispatch that is holding the projection scheduler paused. Within each
  # trigger class, cancel a superseded run so two mutation-capable release
  # verifiers cannot contend for the persistent QA tenants.
  group: prod-verify-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve-release:
    name: Resolve exact production release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_sha: ${{ steps.deployed-release.outputs.release_sha }}
      api_revision: ${{ steps.deployed-release.outputs.api_revision }}
      web_revision: ${{ steps.deployed-release.outputs.web_revision }}
    steps:
      - name: Check out release-verification control plane
        uses: actions/checkout@v4

      - name: Verify one exact API/web production release
        id: deployed-release
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ inputs.expected_release_sha }}
        run: |
          expected=""
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            expected="${DISPATCH_SHA}"
          fi
          # deploy-prod.sh dispatches only after its exact-SHA staleness,
          # traffic, health, and sidecar gates pass. This short grace period
          # covers public endpoint propagation without masking a missing deploy.
          args=(--wait-seconds 180 --interval-seconds 5 --github-output "$GITHUB_OUTPUT")
          if [ -n "$expected" ]; then
            args+=(--expected-sha "$expected")
          fi
          python scripts/verify_deployed_release.py "${args[@]}"

      - name: Record exact serving identity
        run: |
          echo "release_sha=${{ steps.deployed-release.outputs.release_sha }}"
          echo "api_revision=${{ steps.deployed-release.outputs.api_revision }}"
          echo "web_revision=${{ steps.deployed-release.outputs.web_revision }}"

  prod-playwright-shards:
    name: Prod Playwright (${{ matrix.suite }})
    if: github.event_name == 'workflow_dispatch'
    needs: resolve-release
    runs-on: ubuntu-latest
    # GitHub-hosted execution is capped at 40 minutes for this repository.
    # Keep each shard below that boundary and serialize mutation-capable QA
    # work so persistent test tenants cannot race each other.
    timeout-minutes: 38
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        suite:
          - tester
          - legacy
          - supporting
          - patent-statute
    steps:
      - name: Check out the exact serving production release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.release_sha }}

      - name: Recheck exact serving identity at shard boundary
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.resolve-release.outputs.release_sha }}"
          python scripts/verify_deployed_release.py \
            --expected-sha "${{ needs.resolve-release.outputs.release_sha }}" \
            --wait-seconds 30 \
            --interval-seconds 5

      - name: Gate on production QA secrets
        # Fail loudly + early if the secret is missing. Without it the
        # setup project's signIn would fail anyway, but this makes the
        # diagnosis obvious in the run log instead of buried in a
        # Playwright timeout.
        env:
          CASEOPS_QA_PASSWORD: ${{ secrets.CASEOPS_QA_PASSWORD }}
          CASEOPS_IP_QA_PASSWORD: ${{ secrets.CASEOPS_IP_QA_PASSWORD }}
          CASEOPS_MACHINE_READINESS_EVIDENCE_SECRET: ${{ secrets.CASEOPS_MACHINE_READINESS_EVIDENCE_SECRET }}
        run: |
          if [ -z "$CASEOPS_QA_PASSWORD" ]; then
            echo "::error::CASEOPS_QA_PASSWORD secret is not configured."
            echo "Add it under repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "$CASEOPS_IP_QA_PASSWORD" ]; then
            echo "::error::CASEOPS_IP_QA_PASSWORD secret is not configured."
            echo "Add it under repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "$CASEOPS_MACHINE_READINESS_EVIDENCE_SECRET" ]; then
            echo "::error::CASEOPS_MACHINE_READINESS_EVIDENCE_SECRET is not configured."
            echo "Provision the same dedicated value in GitHub Actions and the API Secret Manager binding."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Install Chromium for Playwright
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Verify Playwright Chromium runtime
        timeout-minutes: 2
        run: |
          node <<'NODE'
          const { chromium } = require("@playwright/test");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage();
              await page.setContent("<title>CaseOps CI browser check</title>");
              if ((await page.title()) !== "CaseOps CI browser check") {
                throw new Error("Playwright Chromium did not execute the smoke page");
              }
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Mark prod-Playwright prerequisites ready
        id: prod-playwright-prerequisites
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Run canonical tester production regressions
        if: matrix.suite == 'tester'
        env:
          CASEOPS_QA_PASSWORD: ${{ secrets.CASEOPS_QA_PASSWORD }}
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
          PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          CASEOPS_QA_EMAIL: ${{ vars.CASEOPS_QA_EMAIL }}
          CASEOPS_QA_SLUG: ${{ vars.CASEOPS_QA_SLUG }}
          CASEOPS_RAM_PROD_PASSWORD: ${{ secrets.CASEOPS_QA_PASSWORD }}
          CASEOPS_RAM_PROD_EMAIL: ${{ vars.CASEOPS_QA_EMAIL }}
          CASEOPS_RAM_PROD_SLUG: ${{ vars.CASEOPS_QA_SLUG }}
          CASEOPS_IP_QA_PASSWORD: ${{ secrets.CASEOPS_IP_QA_PASSWORD }}
          CASEOPS_EXPECTED_RELEASE_SHA: ${{ needs.resolve-release.outputs.release_sha }}
          CASEOPS_QA_TRACKED_CASE_BOOKMARK_ID: ${{ vars.CASEOPS_QA_TRACKED_CASE_BOOKMARK_ID }}
          CASEOPS_QA_TRACKED_CASE_CNR: ${{ vars.CASEOPS_QA_TRACKED_CASE_CNR }}
        run: npx playwright test --config=playwright.prod-ram.config.ts --project=tester-prod-chromium --workers=1 --retries=0 --reporter=list --output=test-results/tester

      - name: Run legacy QA production regressions
        if: matrix.suite == 'legacy'
        env:
          CASEOPS_QA_PASSWORD: ${{ secrets.CASEOPS_QA_PASSWORD }}
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
          PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          CASEOPS_QA_EMAIL: ${{ vars.CASEOPS_QA_EMAIL }}
          CASEOPS_QA_SLUG: ${{ vars.CASEOPS_QA_SLUG }}
          CASEOPS_EXPECTED_RELEASE_SHA: ${{ needs.resolve-release.outputs.release_sha }}
          CASEOPS_QA_TRACKED_CASE_BOOKMARK_ID: ${{ vars.CASEOPS_QA_TRACKED_CASE_BOOKMARK_ID }}
          CASEOPS_QA_TRACKED_CASE_CNR: ${{ vars.CASEOPS_QA_TRACKED_CASE_CNR }}
        run: npx playwright test --config=playwright.prod-ram.config.ts --project=prod-chromium --workers=1 --retries=0 --reporter=list --output=test-results/legacy

      - name: Run IPLF-027B A0 quiescence acceptance
        # This is immutable historical rollout evidence tied to one exact
        # predecessor fixture. It is available for deliberate replay but is
        # not a recurring release-health gate after that fixture is retired.
        if: always() && !cancelled() && matrix.suite == 'supporting' && steps.prod-playwright-prerequisites.outputs.ready == 'true' && inputs.run_historical_a0_gate == true
        timeout-minutes: 5
        env:
          CASEOPS_IP_QA_PASSWORD: ${{ secrets.CASEOPS_IP_QA_PASSWORD }}
          CASEOPS_EXPECTED_RELEASE_SHA: ${{ needs.resolve-release.outputs.release_sha }}
          CASEOPS_IP_A0_PROD_MODE: verify
        run: npx playwright test --config=playwright.ip-a0-prod.config.ts --reporter=list --output=test-results/ip-a0

      - name: Check IPLF-037B renewal acceptance configuration
        id: renewal-prerequisites
        if: always() && !cancelled() && matrix.suite == 'supporting' && steps.prod-playwright-prerequisites.outputs.ready == 'true'
        env:
          CASEOPS_IP_RENEWAL_CALENDAR_VERSION_ID: ${{ vars.CASEOPS_IP_RENEWAL_CALENDAR_VERSION_ID }}
          CASEOPS_IP_RENEWAL_RULE_VERSION_ID: ${{ vars.CASEOPS_IP_RENEWAL_RULE_VERSION_ID }}
          CASEOPS_IP_RENEWAL_GRACE_RULE_VERSION_ID: ${{ vars.CASEOPS_IP_RENEWAL_GRACE_RULE_VERSION_ID }}
          CASEOPS_IP_RENEWAL_NEXT_TERM_RULE_VERSION_ID: ${{ vars.CASEOPS_IP_RENEWAL_NEXT_TERM_RULE_VERSION_ID }}
        run: |
          fixture_names=(
            CASEOPS_IP_RENEWAL_CALENDAR_VERSION_ID
            CASEOPS_IP_RENEWAL_RULE_VERSION_ID
            CASEOPS_IP_RENEWAL_GRACE_RULE_VERSION_ID
            CASEOPS_IP_RENEWAL_NEXT_TERM_RULE_VERSION_ID
          )
          configured=0
          for fixture_name in "${fixture_names[@]}"; do
            if [[ -n "${!fixture_name}" ]]; then
              configured=$((configured + 1))
            fi
          done
          if [[ "$configured" -eq 0 ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=IPLF-037B governed acceptance pending::No approved renewal fixture IDs are configured; the external legal-governance activation blocker remains open."
            echo "### IPLF-037B renewal acceptance" >> "$GITHUB_STEP_SUMMARY"
            echo "Not run: all four approved renewal fixture IDs remain unconfigured. The documented legal-governance activation blocker remains open." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$configured" -ne 4 ]]; then
            echo "::error title=Incomplete IPLF-037B configuration::Renewal acceptance is fail-closed because only $configured of 4 governed fixture IDs are configured."
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run IPLF-037B renewal acceptance
        if: always() && !cancelled() && matrix.suite == 'supporting' && steps.prod-playwright-prerequisites.outputs.ready == 'true' && steps.renewal-prerequisites.outputs.configured == 'true'
        timeout-minutes: 8
        env:
          CASEOPS_IP_QA_PASSWORD: ${{ secrets.CASEOPS_IP_QA_PASSWORD }}
          CASEOPS_EXPECTED_RELEASE_SHA: ${{ needs.resolve-release.outputs.release_sha }}
          CASEOPS_IP_RENEWAL_CALENDAR_VERSION_ID: ${{ vars.CASEOPS_IP_RENEWAL_CALENDAR_VERSION_ID }}
          CASEOPS_IP_RENEWAL_RULE_VERSION_ID: ${{ vars.CASEOPS_IP_RENEWAL_RULE_VERSION_ID }}
          CASEOPS_IP_RENEWAL_GRACE_RULE_VERSION_ID: ${{ vars.CASEOPS_IP_RENEWAL_GRACE_RULE_VERSION_ID }}
          CASEOPS_IP_RENEWAL_NEXT_TERM_RULE_VERSION_ID: ${{ vars.CASEOPS_IP_RENEWAL_NEXT_TERM_RULE_VERSION_ID }}
        run: npx playwright test --config=playwright.ip-renewal-prod.config.ts --reporter=list --output=test-results/ip-renewal

      - name: Check IPLF-039F cost acceptance configuration
        id: ip-cost-prerequisites
        if: always() && !cancelled() && matrix.suite == 'supporting' && steps.prod-playwright-prerequisites.outputs.ready == 'true'
        env:
          CASEOPS_IP_COST_PROD_TEST_TENANT_ACK: ${{ vars.CASEOPS_IP_COST_PROD_TEST_TENANT_ACK }}
          CASEOPS_IP_COST_PROD_BILLING_MATTER_IDS_JSON: ${{ vars.CASEOPS_IP_COST_PROD_BILLING_MATTER_IDS_JSON }}
          CASEOPS_IP_COST_PROD_COMPANY_SLUG: ${{ vars.CASEOPS_IP_COST_PROD_COMPANY_SLUG }}
          CASEOPS_IP_COST_PROD_EMAIL: ${{ vars.CASEOPS_IP_COST_PROD_EMAIL }}
          CASEOPS_IP_COST_PROD_PASSWORD: ${{ secrets.CASEOPS_IP_COST_PROD_PASSWORD }}
          CASEOPS_IP_COST_PROD_DOCKET_ID: ${{ vars.CASEOPS_IP_COST_PROD_DOCKET_ID }}
        run: |
          fixture_names=(
            CASEOPS_IP_COST_PROD_TEST_TENANT_ACK
            CASEOPS_IP_COST_PROD_BILLING_MATTER_IDS_JSON
            CASEOPS_IP_COST_PROD_COMPANY_SLUG
            CASEOPS_IP_COST_PROD_EMAIL
            CASEOPS_IP_COST_PROD_PASSWORD
            CASEOPS_IP_COST_PROD_DOCKET_ID
          )
          configured=0
          for fixture_name in "${fixture_names[@]}"; do
            if [[ -n "${!fixture_name}" ]]; then
              configured=$((configured + 1))
            fi
          done
          if [[ "$configured" -eq 0 ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=IPLF-039F deployed acceptance pending::No dedicated cost fixture is configured; generic scheduled production verification continues independently."
            echo "### IPLF-039F cost acceptance" >> "$GITHUB_STEP_SUMMARY"
            echo "Not run: all six dedicated test-tenant values are unconfigured. Configure all six together to activate this mutation-capable exact-release gate." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$configured" -ne 6 ]]; then
            echo "::error title=Incomplete IPLF-039F configuration::Cost acceptance is fail-closed because only $configured of 6 dedicated test-tenant values are configured."
            exit 1
          elif [[ ! -f playwright.ip-cost-prod.config.ts ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=IPLF-039F serving release predates cost acceptance::The exact serving checkout does not contain the dedicated cost config; the newer workflow control plane will not run unreleased test code against it."
            echo "### IPLF-039F cost acceptance" >> "$GITHUB_STEP_SUMMARY"
            echo "Not applicable: the exact serving release predates the release-owned cost acceptance config. Deploy the current main release before certifying IPLF-039F." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run IPLF-039F cost acceptance
        if: always() && !cancelled() && matrix.suite == 'supporting' && steps.prod-playwright-prerequisites.outputs.ready == 'true' && steps.ip-cost-prerequisites.outputs.configured == 'true'
        timeout-minutes: 8
        env:
          CASEOPS_EXPECTED_RELEASE_SHA: ${{ needs.resolve-release.outputs.release_sha }}
          CASEOPS_IP_COST_PROD_TEST_TENANT_ACK: ${{ vars.CASEOPS_IP_COST_PROD_TEST_TENANT_ACK }}
          CASEOPS_IP_COST_PROD_BILLING_MATTER_IDS_JSON: ${{ vars.CASEOPS_IP_COST_PROD_BILLING_MATTER_IDS_JSON }}
          CASEOPS_IP_COST_PROD_COMPANY_SLUG: ${{ vars.CASEOPS_IP_COST_PROD_COMPANY_SLUG }}
          CASEOPS_IP_COST_PROD_EMAIL: ${{ vars.CASEOPS_IP_COST_PROD_EMAIL }}
          CASEOPS_IP_COST_PROD_PASSWORD: ${{ secrets.CASEOPS_IP_COST_PROD_PASSWORD }}
          CASEOPS_IP_COST_PROD_DOCKET_ID: ${{ vars.CASEOPS_IP_COST_PROD_DOCKET_ID }}
        run: npx playwright test --config=playwright.ip-cost-prod.config.ts --reporter=list --output=test-results/ip-cost

      - name: Run prod-Playwright suite (notice module)
        # The RAM batch is intentionally broad and can expose an independent
        # provider or quota incident.  The Notice suite is still a required
        # production signal, so run it after a RAM failure and retain both
        # outcomes in the same fail-closed workflow result.
        if: always() && !cancelled() && matrix.suite == 'supporting' && steps.prod-playwright-prerequisites.outputs.ready == 'true'
        env:
          CASEOPS_QA_PASSWORD: ${{ secrets.CASEOPS_QA_PASSWORD }}
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
          PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          CASEOPS_QA_EMAIL: ${{ vars.CASEOPS_QA_EMAIL }}
          CASEOPS_QA_SLUG: ${{ vars.CASEOPS_QA_SLUG }}
        run: npx playwright test --config=playwright.notice-prod.config.ts --reporter=list --output=test-results/notice

      - name: Check release-owned patent and statute acceptance
        id: patent-statute-prerequisites
        if: always() && !cancelled() && matrix.suite == 'patent-statute' && steps.prod-playwright-prerequisites.outputs.ready == 'true'
        run: |
          if [[ -f tests/e2e/support/patent-acceptance.ts ]]; then
            test -f tests/e2e/ram-2026-09-07-statute-source-data.spec.ts
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The exact serving release predates the patent/statute acceptance projects; newer test code will not run against it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run exact-release patent and domain journeys
        if: always() && !cancelled() && matrix.suite == 'patent-statute' && steps.prod-playwright-prerequisites.outputs.ready == 'true' && steps.patent-statute-prerequisites.outputs.ready == 'true'
        env:
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
          PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          CASEOPS_QA_PASSWORD: ${{ secrets.CASEOPS_QA_PASSWORD }}
          CASEOPS_IP_QA_PASSWORD: ${{ secrets.CASEOPS_IP_QA_PASSWORD }}
          CASEOPS_EXPECTED_RELEASE_SHA: ${{ needs.resolve-release.outputs.release_sha }}
        run: npx playwright test --config=playwright.prod-ram.config.ts --project=patent-prod-chromium --workers=1 --retries=0 --reporter=list --output=test-results/patent

      - name: Verify every release-owned statute source record
        if: always() && !cancelled() && matrix.suite == 'patent-statute' && steps.prod-playwright-prerequisites.outputs.ready == 'true' && steps.patent-statute-prerequisites.outputs.ready == 'true'
        env:
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
          PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          CASEOPS_RAM_PROD_PASSWORD: ${{ secrets.CASEOPS_QA_PASSWORD }}
          CASEOPS_RAM_PROD_EMAIL: qa-bot@caseops.ai
          CASEOPS_RAM_PROD_SLUG: caseops-qa
          CASEOPS_EXPECTED_RELEASE_SHA: ${{ needs.resolve-release.outputs.release_sha }}
        # Read-only batches use bounded parallelism after all mutation phases.
        run: npx playwright test --config=playwright.prod-ram.config.ts --project=statute-source-prod-chromium --workers=4 --retries=0 --reporter=list --output=test-results/statute-sources

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prod-playwright-report-${{ matrix.suite }}
          path: |
            test-results/
          if-no-files-found: error
          retention-days: 14

  scheduled-statute-verification:
    name: Scheduled read-only statute verification
    if: github.event_name == 'schedule'
    needs: resolve-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact serving production release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.release_sha }}

      - name: Recheck exact serving identity
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.resolve-release.outputs.release_sha }}"
          python scripts/verify_deployed_release.py \
            --expected-sha "${{ needs.resolve-release.outputs.release_sha }}" \
            --wait-seconds 30 \
            --interval-seconds 5

      - name: Gate on production QA secret
        env:
          CASEOPS_QA_PASSWORD: ${{ secrets.CASEOPS_QA_PASSWORD }}
        run: |
          if [ -z "$CASEOPS_QA_PASSWORD" ]; then
            echo "::error::CASEOPS_QA_PASSWORD secret is not configured."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Install Chromium for Playwright
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Verify release-owned statute acceptance exists
        run: |
          test -f tests/e2e/support/patent-acceptance.ts
          test -f tests/e2e/ram-2026-09-07-statute-source-data.spec.ts

      - name: Verify every release-owned statute source record
        env:
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
          PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          CASEOPS_RAM_PROD_PASSWORD: ${{ secrets.CASEOPS_QA_PASSWORD }}
          CASEOPS_RAM_PROD_EMAIL: qa-bot@caseops.ai
          CASEOPS_RAM_PROD_SLUG: caseops-qa
          CASEOPS_EXPECTED_RELEASE_SHA: ${{ needs.resolve-release.outputs.release_sha }}
        run: npx playwright test --config=playwright.prod-ram.config.ts --project=statute-source-prod-chromium --workers=4 --retries=0 --reporter=list --output=test-results/statute-sources

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prod-playwright-report-scheduled-statutes
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  record-release-evidence:
    name: Record exact-release evidence
    if: always() && github.event_name == 'workflow_dispatch' && needs.resolve-release.result == 'success' && needs.prod-playwright-shards.result == 'success'
    needs:
      - resolve-release
      - prod-playwright-shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact serving production release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.release_sha }}

      - name: Recheck exact serving identity before evidence write
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.resolve-release.outputs.release_sha }}"
          python scripts/verify_deployed_release.py \
            --expected-sha "${{ needs.resolve-release.outputs.release_sha }}" \
            --wait-seconds 30 \
            --interval-seconds 5

      - name: Record exact-release public-claims evidence
        env:
          CASEOPS_MACHINE_READINESS_EVIDENCE_SECRET: ${{ secrets.CASEOPS_MACHINE_READINESS_EVIDENCE_SECRET }}
          PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          SERVING_RELEASE_SHA: ${{ needs.resolve-release.outputs.release_sha }}
        run: |
          if [ -z "$CASEOPS_MACHINE_READINESS_EVIDENCE_SECRET" ]; then
            echo "::error::CASEOPS_MACHINE_READINESS_EVIDENCE_SECRET is not configured."
            exit 1
          fi
          evidence_ref="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          python scripts/write_machine_readiness_evidence.py \
            --api-base "${PROD_API_BASE_URL:-https://api.caseops.ai}" \
            --producer github-actions/prod-verify \
            --release-sha "$SERVING_RELEASE_SHA" \
            --run-id "github-actions:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" \
            --evidence-ref "$evidence_ref" \
            --operational public_claims_reviewed=pass
