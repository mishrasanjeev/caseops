name: Prod verification (Playwright)

# Runs the brutal-honest prod-Playwright suites against the LIVE
# caseops.ai + api.caseops.ai surface using the dedicated
# CaseOps QA Bot workspace (caseops-qa). Per
# .claude/skills/bug-fixing/SKILL.md "Brutal Honest Testing — No Manual
# QA Dependence": every fix verdict must name the spec line + commit
# SHA that proves it. This job is the canonical proof artifact.
#
# Test infra has zero dependency on real-user credentials — see
# feedback_dedicated_test_account_no_real_users.md.
#
# Triggers:
#   - on push to main: runs after a merge so newly-deployed code is
#     verified end-to-end on the live surface.
#   - schedule (every 6h): catches prod drift (data loss, provider
#     regressions, third-party API changes) between deploys.
#   - workflow_dispatch: manual trigger after a deploy.
#
# Prereq secret: CASEOPS_QA_PASSWORD (the CaseOps QA Bot owner password
# on prod — generated 2026-04-27 during workspace bootstrap, held only
# in a password manager + this GitHub secret). Without it the job
# aborts with a clear message — does NOT silently skip and pass green.

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: "Exact 40-character commit expected on both production services"
        required: false
        type: string

concurrency:
  # Two scheduled runs on the same prod surface contending for the QA
  # Bot session would race the storageState file. Cancel in-progress
  # to keep one run live at a time.
  group: prod-verify
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prod-playwright:
    name: Prod-Playwright suites
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out release-verification control plane
        uses: actions/checkout@v4

      - name: Wait for one exact API/web production release
        id: deployed-release
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          DISPATCH_SHA: ${{ inputs.expected_release_sha }}
        run: |
          expected=""
          if [ "$EVENT_NAME" != "schedule" ]; then
            expected="${DISPATCH_SHA:-$PUSH_SHA}"
          fi
          args=(--wait-seconds 1500 --interval-seconds 15 --github-output "$GITHUB_OUTPUT")
          if [ -n "$expected" ]; then
            args+=(--expected-sha "$expected")
          fi
          python scripts/verify_deployed_release.py "${args[@]}"

      - name: Check out the exact serving production release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.deployed-release.outputs.release_sha }}

      - name: Record exact serving identity
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.deployed-release.outputs.release_sha }}"
          echo "release_sha=${{ steps.deployed-release.outputs.release_sha }}"
          echo "api_revision=${{ steps.deployed-release.outputs.api_revision }}"
          echo "web_revision=${{ steps.deployed-release.outputs.web_revision }}"

      - name: Gate on production QA secrets
        # Fail loudly + early if the secret is missing. Without it the
        # setup project's signIn would fail anyway, but this makes the
        # diagnosis obvious in the run log instead of buried in a
        # Playwright timeout.
        env:
          CASEOPS_QA_PASSWORD: ${{ secrets.CASEOPS_QA_PASSWORD }}
          CASEOPS_IP_QA_PASSWORD: ${{ secrets.CASEOPS_IP_QA_PASSWORD }}
        run: |
          if [ -z "$CASEOPS_QA_PASSWORD" ]; then
            echo "::error::CASEOPS_QA_PASSWORD secret is not configured."
            echo "Add it under repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "$CASEOPS_IP_QA_PASSWORD" ]; then
            echo "::error::CASEOPS_IP_QA_PASSWORD secret is not configured."
            echo "Add it under repo Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Mark prod-Playwright prerequisites ready
        id: prod-playwright-prerequisites
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Run prod-Playwright suite (ram-batch)
        env:
          CASEOPS_QA_PASSWORD: ${{ secrets.CASEOPS_QA_PASSWORD }}
          # Optional overrides — defaults are baked into the setup file
          # (https://caseops.ai + qa-bot@caseops.ai + caseops-qa).
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
          PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          CASEOPS_QA_EMAIL: ${{ vars.CASEOPS_QA_EMAIL }}
          CASEOPS_QA_SLUG: ${{ vars.CASEOPS_QA_SLUG }}
          # Canonical dated regressions run against the same dedicated QA
          # tenant in CI. Local operators can still provide separate tester
          # credentials through these environment variables when needed.
          CASEOPS_RAM_PROD_PASSWORD: ${{ secrets.CASEOPS_QA_PASSWORD }}
          CASEOPS_RAM_PROD_EMAIL: ${{ vars.CASEOPS_QA_EMAIL }}
          CASEOPS_RAM_PROD_SLUG: ${{ vars.CASEOPS_QA_SLUG }}
          CASEOPS_IP_QA_PASSWORD: ${{ secrets.CASEOPS_IP_QA_PASSWORD }}
          CASEOPS_EXPECTED_RELEASE_SHA: ${{ steps.deployed-release.outputs.release_sha }}
          CASEOPS_QA_TRACKED_CASE_BOOKMARK_ID: ${{ vars.CASEOPS_QA_TRACKED_CASE_BOOKMARK_ID }}
          CASEOPS_QA_TRACKED_CASE_CNR: ${{ vars.CASEOPS_QA_TRACKED_CASE_CNR }}
        run: npx playwright test --config=playwright.prod-ram.config.ts --reporter=list

      - name: Run IPLF-027B A0 quiescence acceptance
        # Keep this gate visible even when an independent RAM provider/quota
        # assertion fails. This step is verify-only: fixture preparation is a
        # separately invoked, pre-T_ROUTE operation pinned to the predecessor.
        if: always() && !cancelled() && steps.prod-playwright-prerequisites.outputs.ready == 'true'
        timeout-minutes: 5
        env:
          CASEOPS_IP_QA_PASSWORD: ${{ secrets.CASEOPS_IP_QA_PASSWORD }}
          CASEOPS_EXPECTED_RELEASE_SHA: ${{ steps.deployed-release.outputs.release_sha }}
          CASEOPS_IP_A0_PROD_MODE: verify
        run: npx playwright test --config=playwright.ip-a0-prod.config.ts --reporter=list

      - name: Run IPLF-037B renewal acceptance
        if: always() && !cancelled() && steps.prod-playwright-prerequisites.outputs.ready == 'true'
        timeout-minutes: 8
        env:
          CASEOPS_IP_QA_PASSWORD: ${{ secrets.CASEOPS_IP_QA_PASSWORD }}
          CASEOPS_EXPECTED_RELEASE_SHA: ${{ steps.deployed-release.outputs.release_sha }}
          CASEOPS_IP_RENEWAL_CALENDAR_VERSION_ID: ${{ vars.CASEOPS_IP_RENEWAL_CALENDAR_VERSION_ID }}
          CASEOPS_IP_RENEWAL_RULE_VERSION_ID: ${{ vars.CASEOPS_IP_RENEWAL_RULE_VERSION_ID }}
          CASEOPS_IP_RENEWAL_GRACE_RULE_VERSION_ID: ${{ vars.CASEOPS_IP_RENEWAL_GRACE_RULE_VERSION_ID }}
          CASEOPS_IP_RENEWAL_NEXT_TERM_RULE_VERSION_ID: ${{ vars.CASEOPS_IP_RENEWAL_NEXT_TERM_RULE_VERSION_ID }}
        run: npx playwright test --config=playwright.ip-renewal-prod.config.ts --reporter=list

      - name: Run prod-Playwright suite (notice module)
        # The RAM batch is intentionally broad and can expose an independent
        # provider or quota incident.  The Notice suite is still a required
        # production signal, so run it after a RAM failure and retain both
        # outcomes in the same fail-closed workflow result.
        if: always() && !cancelled() && steps.prod-playwright-prerequisites.outputs.ready == 'true'
        env:
          CASEOPS_QA_PASSWORD: ${{ secrets.CASEOPS_QA_PASSWORD }}
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
          PROD_API_BASE_URL: ${{ vars.PROD_API_BASE_URL }}
          CASEOPS_QA_EMAIL: ${{ vars.CASEOPS_QA_EMAIL }}
          CASEOPS_QA_SLUG: ${{ vars.CASEOPS_QA_SLUG }}
        run: npx playwright test --config=playwright.notice-prod.config.ts --reporter=list

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prod-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
