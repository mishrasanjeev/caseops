name: B5 fixed-step diagnosis ONLY; no release acceptance
'on':
  workflow_dispatch:
    inputs:
      expected_release_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: prod-verify-workflow_dispatch
  cancel-in-progress: false
cache-mode: none
jobs:
  diagnostic:
    name: Three original desktop failures; diagnostic source distinct
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CASEOPS_EXPECTED_RELEASE_SHA: e56437b8672d89e5eeb2a1642be4e759c3c6d2ef
      PROD_BASE_URL: https://caseops.ai
      PROD_API_BASE_URL: https://api.caseops.ai
    steps:
    - name: Check out diagnostic source; never release acceptance
      uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Require the exact diagnostic branch and serving release
      run: 'test "$GITHUB_REF" = "refs/heads/codex/prod624-b5-diagnosis-20261119"

        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

        test "${{ inputs.expected_release_sha }}" = "$CASEOPS_EXPECTED_RELEASE_SHA"

        python scripts/verify_deployed_release.py --expected-sha "$CASEOPS_EXPECTED_RELEASE_SHA" --wait-seconds 30 --interval-seconds
        5

        '
    - uses: actions/setup-node@v4
      with:
        node-version: 22.23.4
    - uses: ./.github/actions/node-trust
      id: node_trust
    - name: Install owned diagnostic dependencies
      env: &id001
        NODE_OPTIONS: ${{ steps.node_trust.outputs.NODE_OPTIONS }}
        SSL_CERT_FILE: ${{ steps.node_trust.outputs.SSL_CERT_FILE }}
        SSL_CERT_DIR: ${{ steps.node_trust.outputs.SSL_CERT_DIR }}
        CASEOPS_HOST_NODE_TRUST_POLICY_FILE: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_FILE }}
        CASEOPS_HOST_NODE_TRUST_POLICY_SHA256: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_SHA256 }}
        NPM_CONFIG_USERCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_USERCONFIG }}
        NPM_CONFIG_GLOBALCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_GLOBALCONFIG }}
        NPM_CONFIG_STRICT_SSL: ${{ steps.node_trust.outputs.NPM_CONFIG_STRICT_SSL }}
        NPM_CONFIG_REGISTRY: ${{ steps.node_trust.outputs.NPM_CONFIG_REGISTRY }}
      run: npm ci
    - name: Install Chromium for Playwright
      env: *id001
      timeout-minutes: 5
      run: npx playwright install chromium
    - name: Run original three desktop bodies with fixed step labels; diagnostic only
      env:
        NODE_OPTIONS: ${{ steps.node_trust.outputs.NODE_OPTIONS }}
        SSL_CERT_FILE: ${{ steps.node_trust.outputs.SSL_CERT_FILE }}
        SSL_CERT_DIR: ${{ steps.node_trust.outputs.SSL_CERT_DIR }}
        CASEOPS_HOST_NODE_TRUST_POLICY_FILE: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_FILE }}
        CASEOPS_HOST_NODE_TRUST_POLICY_SHA256: ${{ steps.node_trust.outputs.CASEOPS_HOST_NODE_TRUST_POLICY_SHA256 }}
        NPM_CONFIG_USERCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_USERCONFIG }}
        NPM_CONFIG_GLOBALCONFIG: ${{ steps.node_trust.outputs.NPM_CONFIG_GLOBALCONFIG }}
        NPM_CONFIG_STRICT_SSL: ${{ steps.node_trust.outputs.NPM_CONFIG_STRICT_SSL }}
        NPM_CONFIG_REGISTRY: ${{ steps.node_trust.outputs.NPM_CONFIG_REGISTRY }}
        CASEOPS_RAM_PROD_SLUG: test-legal
        CASEOPS_RAM_PROD_EMAIL: ram@testfirm.com
        CASEOPS_RAM_PROD_PASSWORD: ${{ secrets.CASEOPS_TEST_LEGAL_PROD_PASSWORD }}
        CASEOPS_PW_EVIDENCE_INVOCATION: b5-diagnostic-desktop
        CASEOPS_PW_EVIDENCE_PHASE: execution
      timeout-minutes: 10
      run: 'set -euo pipefail

        test -n "$CASEOPS_RAM_PROD_PASSWORD"

        export CASEOPS_PW_EVIDENCE_JSON_FILE="$PWD/test-results/prod-native-evidence/b5-diagnostic-desktop/native-results.json"

        export CASEOPS_PW_EVIDENCE_JUNIT_FILE="$PWD/test-results/prod-native-evidence/b5-diagnostic-desktop/native-results.xml"

        mkdir -p "$(dirname "$CASEOPS_PW_EVIDENCE_JSON_FILE")"

        set +e

        node node_modules/@playwright/test/cli.js test --config=playwright.prod-ram.config.ts --project=batch5-prod-chromium
        --workers=1 --retries=0 --reporter=./scripts/prod_playwright_reporter.cjs --output="$RUNNER_TEMP/b5-private-diagnostic"
        --grep=''AI-TEAM-01|B5-CON-005|BUG001 2026-11-11 desktop'' >/dev/null 2>/dev/null

        result=$?

        set -e

        printf ''{"scope":"DIAGNOSTIC ONLY; not release acceptance","diagnostic_source":"%s","serving_source":"%s","exit":%s}\n''
        "$GITHUB_SHA" "$CASEOPS_EXPECTED_RELEASE_SHA" "$result" > test-results/prod-native-evidence/b5-diagnostic-desktop/diagnostic-exit.json

        echo "Original diagnostic bodies exit=$result; sanitized native artifact retained. No release acceptance credit."

        exit "$result"

        '
    - name: Recheck exact serving release
      if: always()
      run: python scripts/verify_deployed_release.py --expected-sha "$CASEOPS_EXPECTED_RELEASE_SHA" --wait-seconds 30 --interval-seconds
        5
    - name: Upload only sanitized native diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: b5-diagnostic-only
        path: test-results/prod-native-evidence/b5-diagnostic-desktop/
        if-no-files-found: error
        retention-days: 7
